name: Windows distribution

# Reusable, called only by this repository's own workflows; no triggers of its
# own. Every job is contents: read and none uses an environment, a credential,
# OIDC or a self-hosted runner. Interface: packaging/windows-signing/README.md.
#
#   release: false  PR / main preview (no release). Verifies the seed, repacks it unsigned,
#                   builds Metro-<v>-windows-x64.unsigned-preview.msi with the
#                   MSI lane (packaging/windows-msi, on Linux), checks and
#                   installs it on a fresh Windows VM, runs the MSI lane's native
#                   tests and self-tests the verifiers with a throwaway
#                   certificate. Uploads dist-desktop-windows-x64.
#   release: true   Only a push (not a deletion) to protected main of
#                   wnzn/metro whose top-level workflow is ci.yml on main,
#                   with exactly github.sha checked out; tags, pull requests
#                   and other branches are refused. Verifies the seed for an
#                   official release (metro-tui.exe required), then follows
#                   the checked-in packaging/windows-release-signing.txt:
#                     signed    (mode official) uploads exactly the seed ZIP
#                               and its .sha256 as unsigned-desktop-windows-x64
#                               for windows-sign.yml.
#                     unsigned  (mode unsigned-release) builds and tests the
#                               same unsigned ZIP, MSI and scripts as a preview
#                               (MSI with metro-tui.exe required) and uploads
#                               dist-desktop-windows-x64 for release-publish.yml.
#                   Still read-only: no environment, credential or OIDC.

on:
  workflow_call:
    inputs:
      release:
        description: 'Official main release when true (signed: hand the seed to windows-sign.yml; unsigned: build the unsigned release dist); unsigned preview when false.'
        type: boolean
        default: false
      version:
        description: 'Version without the leading v (the seed is Metro-<version>-windows-x64.zip).'
        type: string
        required: true
    outputs:
      mode:
        description: 'official (signed main release hand-off), unsigned-release (unsigned main release dist) or preview'
        value: ${{ jobs.seed.outputs.mode }}
      seed-sha256:
        value: ${{ jobs.seed.outputs.seed-sha256 }}

permissions:
  contents: read

jobs:
  # Seed checks without credentials: exact archive, manifest, pinned stock
  # renderer, binary allowlist and the sources this checkout builds from.
  seed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      seed-sha256: ${{ steps.verify.outputs.sha256 }}
      zip-sha256: ${{ steps.preview.outputs.zip }}
      msi-sha256: ${{ steps.preview.outputs.msi }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: mode
        name: Mode (a release only for a push to protected main of wnzn/metro from ci.yml; signed or unsigned as checked in)
        env:
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]{1,40})?$' \
            || { echo "invalid version input" >&2; exit 1; }
          if [ "$RELEASE" = true ]; then
            python3 -I packaging/windows-signing/winsign.py release-context --version "$VERSION" --head "$(git rev-parse HEAD)" >/dev/null
            # packaging/windows-release-signing.txt; anything but signed or unsigned fails here.
            GITHUB_OUTPUT=/dev/null python3 -I packaging/release_policy.py windows-signing > "$RUNNER_TEMP/windows-signing.txt"
            case "$(sed -n 's/^windows_signing=//p' "$RUNNER_TEMP/windows-signing.txt")" in
              signed) echo mode=official >> "$GITHUB_OUTPUT" ;;
              unsigned) echo mode=unsigned-release >> "$GITHUB_OUTPUT" ;;
              *) echo "unknown Windows release signing mode" >&2; exit 1 ;;
            esac
          else
            echo mode=preview >> "$GITHUB_OUTPUT"
          fi
      - name: Signing helper tests
        run: python3 -B -m unittest discover -s packaging/windows-signing -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seed-desktop-windows-x64
          path: ${{ runner.temp }}/seed
      - id: verify
        name: Verify the seed
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          w=packaging/windows-signing/winsign.py
          case "$MODE" in
            official|unsigned-release)
              # Official seed checks for every release, signed or not (all four EXEs, metro-tui.exe included).
              sha="$(python3 -I "$w" verify-seed --seed-dir "$RUNNER_TEMP/seed" \
                --version "$VERSION" --mode official --work "$RUNNER_TEMP/official-check" --scripts-dir packaging)" ;;
            preview) sha="" ;;
            *) echo "unknown mode" >&2; exit 1 ;;
          esac
          if [ "$MODE" = official ]; then
            mkdir "$RUNNER_TEMP/handoff"
            for f in "Metro-$VERSION-windows-x64.zip" "Metro-$VERSION-windows-x64.zip.sha256"; do
              cp -- "$RUNNER_TEMP/seed/$f" "$RUNNER_TEMP/handoff/$f"
            done
            [ "$(sha256sum "$RUNNER_TEMP/handoff/Metro-$VERSION-windows-x64.zip" | cut -c1-64)" = "$sha" ]
          else
            # Previews and unsigned releases repack the seed unsigned (the same seed, for an unsigned release).
            sha="$(python3 -I "$w" verify-seed --seed-dir "$RUNNER_TEMP/seed" --version "$VERSION" --mode preview \
              --work "$RUNNER_TEMP/work" --scripts-dir packaging ${sha:+--expect-sha256 "$sha"})"
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.mode == 'official'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-desktop-windows-x64
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 3
      - id: preview
        if: steps.mode.outputs.mode != 'official'
        name: Unsigned - repack unsigned, build the unsigned-preview MSI and the MSI test fixtures
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          w=packaging/windows-signing/winsign.py
          python3 -I "$w" prepare --work "$RUNNER_TEMP/work" --scripts-dir packaging >/dev/null
          zip="$(python3 -I "$w" finalize --work "$RUNNER_TEMP/work" --mode preview --out-dir "$RUNNER_TEMP/stage" --commit "$COMMIT")"
          python3 -I "$w" extract-final --zip "$RUNNER_TEMP/stage/Metro-$VERSION-windows-x64.zip" --version "$VERSION" \
            --mode preview --expect-sha256 "$zip" --tree-out "$RUNNER_TEMP/tree" --expect-commit "$COMMIT" >/dev/null
          m=packaging/windows-msi/build_msi.py
          python3 -I "$m" fetch-tools --dest "$RUNNER_TEMP/msi-tools"
          require=""
          if [ "$MODE" = unsigned-release ] || [ -e "$RUNNER_TEMP/tree/metro-tui.exe" ]; then
            require="--require-file metro-tui.exe"
          fi
          mkdir "$RUNNER_TEMP/msi"
          # shellcheck disable=SC2086
          python3 -I "$m" build --tools "$RUNNER_TEMP/msi-tools" --payload "$RUNNER_TEMP/tree" --version "$VERSION" \
            --out "$RUNNER_TEMP/msi/Metro-$VERSION-windows-x64.unsigned-preview.msi" --preview $require
          python3 -I "$w" msi-state --msi "$RUNNER_TEMP/msi/Metro-$VERSION-windows-x64.unsigned-preview.msi" --expect unsigned
          python3 -I "$m" fixtures --tools "$RUNNER_TEMP/msi-tools" --dest "$RUNNER_TEMP/fixtures"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "msi=$(sha256sum "$RUNNER_TEMP/msi/Metro-$VERSION-windows-x64.unsigned-preview.msi" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.mode != 'official'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview-stage
          path: ${{ runner.temp }}/stage/
          if-no-files-found: error
          retention-days: 3
      - if: steps.mode.outputs.mode != 'official'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview-msi
          path: ${{ runner.temp }}/msi/
          if-no-files-found: error
          retention-days: 3
      - if: steps.mode.outputs.mode != 'official'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview-msi-fixtures
          path: ${{ runner.temp }}/fixtures/
          if-no-files-found: error
          retention-days: 3
      # Previews only: ci.yml's windows-update-builds made the test launchers
      # (never on a release run). MSIs A and B and a test release of B, for
      # the `updates` job only; never part of the dist.
      - if: steps.mode.outputs.mode == 'preview'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-update-e2e-builds
          path: ${{ runner.temp }}/update-builds
      - if: steps.mode.outputs.mode == 'preview'
        name: In-app MSI update fixtures (test builds 1.0.0 and 1.0.1, test release of 1.0.1)
        run: |
          set -eu
          m=packaging/windows-msi/build_msi.py
          u=packaging/windows-msi/update_fixture.py
          b="$RUNNER_TEMP/update-builds"
          o="$RUNNER_TEMP/update-fixtures"
          mkdir -p "$o/msi"
          for v in 1.0.0 1.0.1; do
            p="$(python3 -I "$u" payload --version "$v" --launcher "$b/launcher-$v.exe" --ui "$b/msi_update_ui.exe" \
              --dest "$RUNNER_TEMP/update-payload-$v")"
            python3 -I "$m" build --tools "$RUNNER_TEMP/msi-tools" --payload "$p" --version "$v" --preview \
              --out "$o/msi/Metro-$v-windows-x64.unsigned-preview.msi"
          done
          python3 -I "$u" release --version 1.0.1 --msi "$o/msi/Metro-1.0.1-windows-x64.unsigned-preview.msi" \
            --dest "$o/release"
      - if: steps.mode.outputs.mode == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update-msi-fixtures
          path: ${{ runner.temp }}/update-fixtures/
          if-no-files-found: error
          retention-days: 3

  # Previews only: in-app updates on a fresh Windows VM with test builds and a
  # loopback test release. The script/ZIP install (install, migrate, update,
  # commit, rollback), then the per-user MSI (update, failure and retry,
  # helper or msiexec killed; update and failure as a standard user).
  # Uploads only logs.
  updates:
    if: needs.seed.outputs.mode == 'preview'
    needs: seed
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-update-e2e-builds
          path: ${{ runner.temp }}/update-builds
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-update-msi-fixtures
          path: ${{ runner.temp }}/update-fixtures
      - name: Script install, in-app update, commit and rollback (packaging/windows_update_e2e.py)
        id: script
        timeout-minutes: 15
        run: |
          python -I -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $b = "$env:RUNNER_TEMP\update-builds"
          python -I packaging/windows_update_e2e.py --desktop "$b\launcher-1.0.0.exe" --ui-stub "$b\metro-ui-stub.exe" `
            --log-dir "$env:RUNNER_TEMP\update-logs\script" --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Independent of the script test: also run when it failed, so one red run reports both.
      - name: MSI install, in-app update, failure and retry, helper killed (current and standard user)
        if: ${{ !cancelled() && (steps.script.outcome == 'success' || steps.script.outcome == 'failure') }}
        timeout-minutes: 45
        run: |
          $f = "$env:RUNNER_TEMP\update-fixtures"
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-msi\test-msi-update.ps1') `
            -MsiA "$f\msi\Metro-1.0.0-windows-x64.unsigned-preview.msi" -MsiB "$f\msi\Metro-1.0.1-windows-x64.unsigned-preview.msi" `
            -VersionA 1.0.0 -VersionB 1.0.1 -ReleaseRoot "$f\release" -LogDir "$env:RUNNER_TEMP\update-logs\msi" -StandardUser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-update-logs
          path: ${{ runner.temp }}/update-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Previews and unsigned releases: the unsigned build, checked and installed natively.
  # An unsigned release publishes exactly this job's dist-desktop-windows-x64.
  preview:
    if: needs.seed.outputs.mode == 'preview' || needs.seed.outputs.mode == 'unsigned-release'
    needs: seed
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-stage
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-msi
          path: ${{ runner.temp }}/msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-msi-fixtures
          path: ${{ runner.temp }}/fixtures
      - name: Assemble the preview and verify it (exact files, checksums, re-extracted ZIP, MSI tables and admin image)
        env:
          SEED_SHA256: ${{ needs.seed.outputs.seed-sha256 }}
          ZIP_SHA256: ${{ needs.seed.outputs.zip-sha256 }}
          MSI_SHA256: ${{ needs.seed.outputs.msi-sha256 }}
          COMMIT: ${{ github.sha }}
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-signing\MetroWindowsSigning.psm1')
          python -I -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = $env:RUNNER_TEMP
          $name = "Metro-$env:VERSION-windows-x64.unsigned-preview.msi"
          $names = (Get-ChildItem "$t\msi" -Force | ForEach-Object Name) -join ' '
          if ($names -ne $name) { throw "unexpected MSI artifact contents: $names" }
          if ((Get-FileHash -LiteralPath "$t\msi\$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MSI_SHA256) { throw 'MSI changed between jobs' }
          Copy-Item -LiteralPath "$t\msi\$name" -Destination "$t\dist\$name"
          [IO.File]::WriteAllText("$t\dist\$name.sha256", "$env:MSI_SHA256  $name`n", [Text.UTF8Encoding]::new($false))
          Invoke-WinSign verify-dist --dist "$t\dist" --version $env:VERSION --mode preview --scripts-dir packaging `
            --tree-out "$t\tree" --sums-out "$t\windows-SHA256SUMS" --expect-zip-sha256 $env:ZIP_SHA256 `
            --expect-seed-sha256 $env:SEED_SHA256 --expect-commit $env:COMMIT | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory "$t\logs" | Out-Null
          Test-MetroMsiCandidate -Msi "$t\dist\$name" -Tree "$t\tree" -Version $env:VERSION -Mode preview -Expect unsigned -LogDir "$t\logs"
          "MSI_NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install the preview MSI into a chosen folder, check the payload, run the server, uninstall
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-signing\MetroWindowsSigning.psm1')
          $t = $env:RUNNER_TEMP
          Test-MetroMsiInstall -Msi "$t\dist\$env:MSI_NAME" -Tree "$t\tree" -Version $env:VERSION -Mode preview -LogDir "$t\logs"
      - name: The legacy install script refuses to install next to the MSI and leaves its shortcut and files alone
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-signing\MetroWindowsSigning.psm1')
          $t = $env:RUNNER_TEMP
          Test-MetroScriptMsiCoexistence -Msi "$t\dist\$env:MSI_NAME" -Zip "$t\dist\Metro-$env:VERSION-windows-x64.zip" `
            -Script (Join-Path $env:GITHUB_WORKSPACE 'packaging\install-metro-windows.ps1') -Version $env:VERSION -LogDir "$t\logs"
      # On this disposable GitHub-hosted runner the harness creates an ephemeral standard
      # (non-admin) local account that installs, inspects and uninstalls in its own
      # context: refused (1625) under Windows Server's default DisableMsi, then allowed
      # with DisableMsi=0 (Windows client behaviour); account, profile and policy are
      # restored afterwards.
      - name: MSI lane native tests (fixtures, upgrade, repair, downgrade, uninstall; then the preview MSI)
        id: msi-lifecycle
        run: |
          $t = $env:RUNNER_TEMP
          $require = @()
          if (Test-Path -LiteralPath "$t\tree\metro-tui.exe") { $require = @('-RequireFile', 'metro-tui.exe') }
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-msi\test-msi-windows.ps1') `
            -FixturesDir "$t\fixtures" -Msi "$t\dist\$env:MSI_NAME" -Version $env:VERSION -LogDir "$t\logs\msi-lane" @require `
            -StandardUserFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Independent diagnostic on the same validated inputs: also run it when the MSI
      # lifecycle failed, so one red run reports both. Never after cancellation or when
      # an earlier step failed (the lifecycle is then skipped). The job still fails and
      # the dist upload below still needs every step green.
      - name: Verifier self-test with a throwaway certificate (never trusted, never shipped)
        if: ${{ !cancelled() && (steps.msi-lifecycle.outcome == 'success' || steps.msi-lifecycle.outcome == 'failure') }}
        env:
          # The module refuses the self-test unless this is exactly 'preview'.
          METRO_WINDOWS_SELF_TEST: ${{ (needs.seed.outputs.mode == 'preview' || needs.seed.outputs.mode == 'unsigned-release') && 'preview' || 'release' }}
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-signing\MetroWindowsSigning.psm1')
          $t = $env:RUNNER_TEMP
          Invoke-MetroVerifierSelfTest -Tree "$t\tree" -Msi "$t\dist\$env:MSI_NAME" -SourceScripts (Join-Path $env:GITHUB_WORKSPACE 'packaging')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-preview-logs
          path: |
            ${{ runner.temp }}/logs/*.log
            ${{ runner.temp }}/logs/msi-lane/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-windows-x64
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14
