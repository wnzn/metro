name: Self-hosted desktop validation

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the desktop Shell tests only (still check and build).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'wnzn/metro'
      && github.repository_id == '1467654868' && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'wnzn/metro/.github/workflows/self-hosted-ci.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # Actions expressions compare strings case-insensitively. Verify the exact
      # dispatch on a hosted runner before the self-hosted job can be queued.
      - name: Require the literal Metro main dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ||
                "$GITHUB_REPOSITORY" != wnzn/metro ||
                "$GITHUB_REPOSITORY_ID" != 1467654868 ||
                "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_WORKFLOW_REF" != wnzn/metro/.github/workflows/self-hosted-ci.yml@refs/heads/main ]]; then
            echo "::error::This workflow only accepts a manual dispatch on wnzn/metro's literal main branch."
            exit 1
          fi

  desktop:
    needs: authorize
    # This is a routing label, not an authorization mechanism. Runner access is
    # configured separately. Registration may omit all default labels.
    runs-on: metro-ci-linux-x64
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify the Linux x64 runner and preinstalled Native Shell
        env:
          NSH_VERSION: 0.6.1
          # nsh/bin/nsh from the checksum-verified official v0.6.1 Linux x64 archive.
          NSH_CLI_SHA256: 8eb4cedc71aaaeeda729d4dba7d0fb2040db29cce98cd6ff3dad6df7d5d5bafd
        run: |
          set -euo pipefail
          if [[ -z "$RUNNER_NAME" || "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ||
                "$(uname -s)" != Linux || "$(uname -m)" != x86_64 ]]; then
            echo "::error::A named Linux x64 runner is required."
            exit 1
          fi
          printf 'Runner: %q (OS=%s, ARCH=%s)\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          if ! nsh_path="$(type -P nsh)" || ! nsh_path="$(realpath -- "$nsh_path")"; then
            echo "::error::Install the pinned Linux x64 NSH $NSH_VERSION on the runner PATH."
            exit 1
          fi
          hash="$(sha256sum < "$nsh_path")"
          if [[ "${hash%% *}" != "$NSH_CLI_SHA256" || "$nsh_path" == *$'\n'* || "$nsh_path" == *$'\r'* ]]; then
            echo "::error::The runner PATH must point to the official Linux x64 NSH $NSH_VERSION binary."
            exit 1
          fi
          "$nsh_path" --version
          printf 'METRO_NSH=%s\n' "$nsh_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checked-out dispatch commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check desktop source
        working-directory: apps/desktop
        run: '"$METRO_NSH" check'
      - name: Build desktop release bundle (no publication)
        working-directory: apps/desktop
        run: '"$METRO_NSH" build --release'
      - name: Run desktop tests
        if: ${{ !inputs.smoke }}
        working-directory: apps/desktop
        run: '"$METRO_NSH" test'
      - name: Run desktop Shell smoke tests
        if: inputs.smoke
        working-directory: apps/desktop
        run: '"$METRO_NSH" test src/features/Shell.test.tsx'
