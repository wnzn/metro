name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: ./examples/workspace/check.sh
      - run: cargo build --locked --workspace --bin metro-server --bin metro-runner
      - name: End-to-end smoke test with a local model double
        run: python3 tests/e2e/smoke.py --timeout 60
      - name: End-to-end Chat and Threads test with a local model double
        run: python3 tests/e2e/threads.py --timeout 60

  desktop:
    runs-on: ubuntu-24.04
    env:
      NSH_VERSION: v0.6.1
      NSH_ARCHIVE_SHA256: 9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Longbridge Native Shell
        run: |
          set -eu
          install_dir="$RUNNER_TEMP/nsh-$NSH_VERSION"
          mkdir -p "$install_dir"
          archive="$install_dir/nsh-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/nsh-linux-x86_64.tar.gz"
          printf '%s  %s\n' "$NSH_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir"
          printf '%s\n' "$install_dir/nsh/bin" >> "$GITHUB_PATH"
      - run: nsh check
        working-directory: apps/desktop
      - run: nsh test
        working-directory: apps/desktop
      - run: nsh build --release
        working-directory: apps/desktop

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: docker build --target server -t metro-server:ci .
      - run: docker build --target runner -t metro-runner:ci .

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [rust, desktop, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build release images
        run: |
          set -eu
          repository="${GITHUB_REPOSITORY,,}"
          epoch="$(git log -1 --format=%ct)"
          for component in server runner; do
            image="ghcr.io/${repository}/metro-${component}:${GITHUB_REF_NAME}"
            docker build --target "$component" \
              --build-arg "SOURCE_DATE_EPOCH=$epoch" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "$image" .
          done
      - name: Publish tagged images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="${GITHUB_REPOSITORY,,}"
          for component in server runner; do
            docker push "ghcr.io/${repository}/metro-${component}:${GITHUB_REF_NAME}"
          done
