[package]
name = "metro-desktop"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Metro desktop launcher: starts the packaged Metro UI with a private loopback bridge, serves the person's on-device model connections (linked metro-connector) and the bundled local workspace, and cleans everything up when the UI exits."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "metro-desktop"
path = "src/main.rs"

# The stand-in UI for the native MSI update tests (never shipped).
[[example]]
name = "msi_update_ui"
path = "examples/msi_update_ui.rs"

[features]
# End-to-end test builds only (packaging/windows-msi/test-msi-update.ps1).
e2e-test-release = ["metro-connector/e2e-test-release"]

# Every version below is one Cargo.lock already resolves.
[dependencies]
metro-connector = { path = "../connector" }
metro-release = { path = "../release" }
# The UI's NO_PROXY: loopback and Tailscale reached directly.
metro-url-policy = { path = "../url-policy" }
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"
