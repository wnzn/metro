[project]
name = "metro-embeddinggemma2"
version = "0.1.0"
description = "Optional self-hosted reference media embedding service for Metro (google/embeddinggemma-2)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sentence-transformers==6.3.0",
    "transformers==5.24.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "pypdf==7.1.1",
    "pypdfium2==5.15.2",
    "av==19.0.2",
    "defusedxml==0.7.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: needs the pinned google/embeddinggemma-2 weights (opt-in, METRO_EG2_REAL=1)"]
