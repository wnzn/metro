[package]
name = "metro-url-policy"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "How Metro clients treat a plain-HTTP Metro server URL: loopback and Tailscale hosts silently, any other host with a clear warning. No dependencies."
license = "MIT OR Apache-2.0"

[lib]
name = "metro_url_policy"
path = "src/lib.rs"

[dev-dependencies]
# Reads the shared test vectors (testdata/host_vectors.json).
serde_json = "1.0.150"
# Cross-checks the predictor against ureq's public proxy matcher.
ureq = { version = "3.5.2", default-features = false }
