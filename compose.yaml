services:
  server:
    build:
      context: .
      target: server
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      METRO_BIND: 0.0.0.0:8787
      METRO_DB: /data/metro.sqlite3
      # Supply a dev user map or both OIDC values; the server validates the choice.
      METRO_DEV_USERS:
      METRO_OIDC_ISSUER:
      METRO_OIDC_AUDIENCE:
      METRO_OIDC_ACTOR_CLAIM:
      METRO_OIDC_REQUIRED_TYP:
      METRO_OIDC_LEEWAY_SECS:
      METRO_MODEL:
      METRO_MODEL_BASE_URL:
      METRO_MODEL_API_KEY:
    volumes:
      - server-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", ": >/dev/tcp/127.0.0.1/8787"]
      interval: 3s
      timeout: 2s
      retries: 10

  runner:
    profiles: [runner]
    build:
      context: .
      target: runner
      args:
        RUNNER_UID: "${METRO_RUNNER_UID:-1000}"
        RUNNER_GID: "${METRO_RUNNER_GID:-1000}"
    init: true
    depends_on:
      server:
        condition: service_healthy
    environment:
      METRO_SERVER_URL: http://server:8787
      # This HTTP hop stays inside the Compose network; remote runners use HTTPS.
      METRO_ALLOW_INSECURE_HTTP: "1"
      # Obtain a Space-issued token before starting this optional service.
      METRO_RUNNER_TOKEN: "${METRO_RUNNER_TOKEN:-}"
      METRO_WORKSPACE: /workspace
      METRO_CHECK_ARGV:
      METRO_MCP_ARGV:
      # Docker sandboxing is for a separate Docker-capable host runner.
      METRO_SANDBOX: "${METRO_SANDBOX:-none}"
    volumes:
      - type: bind
        source: "${METRO_WORKSPACE_HOST:-./examples/workspace}"
        target: /workspace
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  server-data:
