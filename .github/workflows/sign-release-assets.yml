name: Sign release assets

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v.
        required: true
        type: string
      revision:
        description: Commit pinned by the main release gate for v<version>.
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require Metro CI on a protected main push
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != wnzn/metro || "$REPOSITORY_ID" != 1467654868 ||
                "$GITHUB_EVENT_NAME" != push || "$REF_PROTECTED" != true || "$PUSH_DELETED" != false ||
                "$REF_TYPE" != branch || "$GITHUB_REF" != refs/heads/main ||
                "$WORKFLOW_REF" != wnzn/metro/.github/workflows/ci.yml@refs/heads/main ||
                "$REVISION" != "$GITHUB_SHA" || "$REVISION" != "$PUSH_AFTER" ||
                ! "$REVISION" =~ ^[0-9a-f]{40}$ ||
                ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release signing requires Metro CI on a protected main push of the pinned commit."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check that the public release tag resolves to the triggering commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 -I packaging/release-signatures/release_signatures.py check-tag \
            --version "$VERSION" --revision "$GITHUB_SHA"

  sign:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # These look up immutable artifacts by exact name in this workflow run only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-digests
          path: ${{ runner.temp }}/release-image-digests
          digest-mismatch: error
      - name: Download and check the pinned cosign binary
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/cosign.XXXXXX")"
          sh packaging/release-signatures/install_cosign.sh "$dir/cosign"
          printf 'METRO_COSIGN=%s\n' "$dir/cosign" >> "$GITHUB_ENV"
      - name: Check and stage the exact release files
        run: |
          python3 -I packaging/release-signatures/release_signatures.py prepare \
            --version "$VERSION" --revision "$GITHUB_SHA" \
            --assets "$RUNNER_TEMP/release-assets" \
            --image-digests "$RUNNER_TEMP/release-image-digests" \
            --directory "$RUNNER_TEMP/signed-release-assets"
      - name: Sign with GitHub OIDC and verify before uploading
        run: |
          set -euo pipefail
          python3 -I packaging/release-signatures/release_signatures.py check-tag \
            --version "$VERSION" --revision "$GITHUB_SHA"
          python3 -I packaging/release-signatures/release_signatures.py sign \
            --version "$VERSION" --revision "$GITHUB_SHA" --cosign "$METRO_COSIGN" \
            --directory "$RUNNER_TEMP/signed-release-assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: ${{ runner.temp }}/signed-release-assets/
          if-no-files-found: error
          retention-days: 14
