name: Release artifacts

# Reusable, read-only platform build and smoke gates. PRs and main pushes that
# do not release get preview artifacts only. An eligible protected main push (a
# version bump) instead hands off the Linux archives, the ad hoc signed
# Apple-silicon macOS archive and, per packaging/windows-release-signing.txt,
# either the verified Windows ZIP seed for signing (signed) or the natively
# tested unsigned Windows build (unsigned). No job in this tree can sign with
# credentials or publish.
#
# Runners (inputs.self_hosted, from ci.yml's `workflows` selector): Linux jobs
# on `metro-ci-linux-docker` and the Mac on `metro-ci-macos-arm64` when true;
# GitHub-hosted ubuntu-24.04 and macos-15 otherwise (forks, any doubt).
# Native Windows jobs are always GitHub-hosted. There is no Intel Mac build
# and no Developer ID signing or notarization.

on:
  workflow_call:
    inputs:
      release:
        description: 'Stage native signing inputs for an official main release; false yields a preview.'
        type: boolean
        default: false
      version:
        description: 'Official builds: the checked-in version chosen by release_policy.py decide (no leading v).'
        type: string
        default: ''
      self_hosted:
        description: "Use Metro's self-hosted Linux and macOS runners (ci.yml decides: trusted events only)."
        type: boolean
        default: false

permissions:
  contents: read

env:
  NSH_VERSION: v0.6.1
  # Official longbridge/nsh v0.6.1 release assets (digests from the GitHub release).
  NSH_LINUX_SHA256: 9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070
  NSH_WINDOWS_SHA256: 7952c84b165e13515bd2ad2787ef22622e49ce88cb8d877825e40b40f3aff4be
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  meta:
    runs-on: ${{ inputs.self_hosted && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: v
        env:
          RELEASE: ${{ inputs.release }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "$RELEASE" = true ]; then
            # Official builds only for the protected main push (release_policy.py), and only
            # for the checked-in version that the caller's release decision chose.
            python3 -I packaging/release_policy.py provenance > "$RUNNER_TEMP/policy.txt"
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/policy.txt")"
            if [ -z "$version" ] || [ "$version" != "$INPUT_VERSION" ]; then
              echo "the release version input is not the checked-in version" >&2
              exit 1
            fi
          else
            # Same base version as the app manifest, so previews exercise the real manifest
            # version instead of an unrelated placeholder.
            python3 -I packaging/release_policy.py version > "$RUNNER_TEMP/policy.txt"
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/policy.txt")-ci"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Native Linux x64 runner. Built in the same Debian bookworm toolchain image
  # as the GHCR runner image, so it needs glibc <= 2.36. Windows has no runner
  # build: confinement uses Linux openat2.
  runner-linux:
    needs: meta
    runs-on: ${{ inputs.self_hosted && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build metro-runner in the bookworm toolchain image
        env:
          # Official releases only: such a build checks for and offers updates
          # (metro-release). Previews and PR package smoke stay source builds.
          METRO_RELEASE_CHANNEL: ${{ inputs.release && 'release' || '' }}
        run: |
          set -eu
          docker build --target build --build-arg METRO_RELEASE_CHANNEL="$METRO_RELEASE_CHANNEL" -t metro-build:release .
          cid="$(docker create metro-build:release)"
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/runner-bin"
          docker cp "$cid:/build/target/release/metro-runner" "$RUNNER_TEMP/runner-bin/metro-runner"
      - name: Binary is x86-64 ELF and needs glibc 2.36 or older
        run: |
          set -eu
          bin="$RUNNER_TEMP/runner-bin/metro-runner"
          file "$bin" | grep -q 'ELF 64-bit.*x86-64'
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.36\n' "$newest" | sort -V | tail -1)" = GLIBC_2.36 ]
      - name: Third-party notices for the runner (Cargo sources fetched, locked)
        run: |
          set -eu
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          python3 -I packaging/cargo-notices.py --target x86_64-unknown-linux-gnu \
            --package metro-runner --out "$RUNNER_TEMP/notices-runner.txt"
      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          python3 -I packaging/package.py runner --version "$VERSION" \
            --binary "$RUNNER_TEMP/runner-bin/metro-runner" \
            --notices "$RUNNER_TEMP/notices-runner.txt" --out-dir dist
          ls -l dist
      - name: Archive has the confirmed name, matches its checksum and extracts (fresh directory)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          name="Metro-runner-$VERSION-linux-x64.tar.gz"
          test "$(find dist -mindepth 1 -maxdepth 1 -exec basename {} \; | sort | tr '\n' ' ')" = "$name $name.sha256 " \
            || { echo "unexpected dist contents" >&2; ls dist; exit 1; }
          (cd dist && sha256sum --check "$name.sha256")
          out="$(mktemp -d "$RUNNER_TEMP/runner-extract.XXXXXX")"
          tar -xzf "dist/$name" -C "$out"
          exe="$out/Metro-runner-$VERSION-linux-x64/metro-runner"
          test -x "$exe"
          # Starting without configuration must fail with a message, never hang or crash.
          set +e
          timeout 10 env -i PATH=/usr/bin:/bin "$exe" >"$out/run.log" 2>&1
          code=$?
          set -e
          echo "exit code without configuration: $code"
          [ "$code" -ne 124 ] && [ "$code" -lt 128 ]
      - name: Per-user runner installer (throwaway home with spaces; nothing started)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          home="$(mktemp -d "$RUNNER_TEMP/runner home.XXXXXX")"
          export HOME="$home"
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          i="$GITHUB_WORKSPACE/packaging/install-metro-runner-linux.sh"
          a="$GITHUB_WORKSPACE/dist/Metro-runner-$VERSION-linux-x64.tar.gz"
          sh "$i" install --archive "$a"
          mkdir "$home/work space"
          # Throwaway credential, never printed and never accepted by any server.
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$home/runner token"
          chmod 600 "$home/runner token"
          sh "$i" configure --server-url http://192.0.2.1:8787 --workspace "$home/work space" --token-file "$home/runner token" \
            >"$home/configure.stdout" 2>"$home/configure.stderr"
          grep -Fq "warning: plain HTTP to 192.0.2.1 isn't encrypted" "$home/configure.stderr" \
            || { echo "missing unencrypted HTTP warning on stderr" >&2; exit 1; }
          if grep -aFq -f "$home/runner token" "$home/configure.stdout" "$home/configure.stderr"; then
            echo "HTTP configure printed the runner token" >&2; exit 1
          else
            test "$?" -eq 1
          fi
          sh "$i" configure --server-url https://metro.invalid --workspace "$home/work space" --token-file "$home/runner token"
          sh "$i" doctor
          sh "$i" update --archive "$a"
          test "$(readlink "$home/.local/share/metro-runner/current")" = "versions/$VERSION"
          sh "$i" uninstall
          test ! -e "$home/.local/share/metro-runner"
          test -f "$home/.config/metro-runner/runner.env" && test -f "$home/runner token" && test -d "$home/work space"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-runner-linux-x64
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Packages the TSX app once with the official Linux NSH CLI. The Windows
  # target is cross-packaged with the pinned, checksum-verified Windows NSH
  # distribution as NSH_RUNTIME.
  ui:
    needs: meta
    runs-on: ${{ inputs.self_hosted && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned NSH (Linux CLI + Windows distribution)
        run: |
          set -eu
          base="https://github.com/longbridge/nsh/releases/download/$NSH_VERSION"
          for pair in "nsh-linux-x86_64.tar.gz:$NSH_LINUX_SHA256" "nsh-windows-x86_64.zip:$NSH_WINDOWS_SHA256"; do
            name="${pair%%:*}"
            curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$name" "$base/$name"
            printf '%s  %s\n' "${pair##*:}" "$RUNNER_TEMP/$name" | sha256sum --check -
          done
          mkdir -p "$RUNNER_TEMP/nsh-linux" "$RUNNER_TEMP/nsh-windows"
          tar -xzf "$RUNNER_TEMP/nsh-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/nsh-linux"
          unzip -q "$RUNNER_TEMP/nsh-windows-x86_64.zip" -d "$RUNNER_TEMP/nsh-windows"
          printf '%s\n' "$RUNNER_TEMP/nsh-linux/nsh/bin" >> "$GITHUB_PATH"
      - name: nsh package (windows and linux)
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          NSH_RUNTIME="$RUNNER_TEMP/nsh-windows/nsh/runtime" \
            nsh package App.tsx --target windows --app-version "${VERSION#v}" --out "$RUNNER_TEMP/out-windows"
          nsh package App.tsx --target linux --app-version "${VERSION#v}" --out "$RUNNER_TEMP/out-linux"
          cd "$GITHUB_WORKSPACE"
          for target in windows linux; do
            # nsh/capabilities.json is the manifest the packaged host actually reads.
            python3 -I - "$RUNNER_TEMP/out-$target/Metro/nsh" "${VERSION#v}" <<'PY'
          import json, sys
          nsh, version = sys.argv[1:]
          app = json.load(open(nsh + "/app.json"))
          cap = json.load(open(nsh + "/capabilities.json"))
          src = json.load(open("apps/desktop/nsh.json"))["capabilities"]
          assert app["version"] == version, app["version"]
          assert cap["process"]["env"] == src["process"]["env"], cap["process"]
          assert {"METRO_DESKTOP_BRIDGE_URL", "METRO_DESKTOP_BRIDGE_TOKEN"} <= set(cap["process"]["env"])
          # NSH expands the manifest with defaults, so compare after normalizing the source the same way.
          want = json.loads(json.dumps(src))
          want.setdefault("network", {}).setdefault("http", [])
          want.setdefault("process", {}).setdefault("execute", [])
          want["process"].setdefault("exit", False)
          assert cap == want, "packaged capabilities differ from apps/desktop/nsh.json after normalization"
          # Stock NSH writes `"schemes": []` even when unused; only a non-empty registration is a problem.
          assert not any(app.get(k) for k in ("singleInstance", "schemes", "fileTypes")), "would start the UI without the launcher"
          PY
          done
          test -f "$RUNNER_TEMP/out-windows/Metro/Metro.exe"
          test -f "$RUNNER_TEMP/out-windows/Metro/nsh/bundle.nshc"
          test -f "$RUNNER_TEMP/out-linux/Metro/Metro"
          test -f "$RUNNER_TEMP/out-linux/Metro/nsh/bundle.nshc"
          file "$RUNNER_TEMP/out-windows/Metro/Metro.exe" | grep -q 'PE32+.*x86-64'
      - name: Stage ui and NSH root per target
        run: |
          set -eu
          for target in windows linux; do
            stage="$RUNNER_TEMP/stage-$target"
            mkdir -p "$stage"
            cp -r "$RUNNER_TEMP/out-$target/Metro" "$stage/ui"
            cp -r "$RUNNER_TEMP/nsh-$target/nsh" "$stage/nsh-root"
            rm -rf "$stage/nsh-root/bin"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-windows-x64
          path: ${{ runner.temp }}/stage-windows
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-linux-x64
          path: ${{ runner.temp }}/stage-linux
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Native Windows x64: metro-desktop (with the connector linked in) and metro-server
  # are compiled on a Windows runner (MSVC), never cross-compiled. No runner here.
  desktop-windows:
    needs: [meta, ui]
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-windows-x64
          path: ${{ runner.temp }}/stage
      - name: Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      # Previews only: official builds always compile from a clean target. Only
      # main pushes write the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          key: x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Locked fetch and native tests of the launcher
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          python -I -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p metro-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # In-app updates: the script install's instance-lock handoff and the MSI update's Windows facts.
          cargo test --locked --release --target x86_64-pc-windows-msvc -p metro-connector --lib -- desktop::store::handoff_tests desktop::update::msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test OpenAI sign-in and credential storage on native Windows (deterministic fixtures)
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p metro-connector --test desktop_sign_in --test openai_oauth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p metro-connector --lib openai_oauth::store::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # "Use locally" on Windows: the launcher's LocalServer starts the real
      # metro-server (socket handed over on stdin), the bridge binds the
      # session, and local tools or the installed runner answer Test runner,
      # before and after a restart.
      - name: Test runner through the desktop's local tools and installed runner on native Windows
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p metro-server --test desktop_local_runner --test desktop_tools --test desktop_runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build metro-desktop, metro-server and metro-tui (native, locked)
        env:
          # Official releases only (see runner-linux).
          METRO_RELEASE_CHANNEL: ${{ inputs.release && 'release' || '' }}
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin metro-desktop --bin metro-server --bin metro-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in 'metro-desktop.exe', 'metro-server.exe', 'metro-tui.exe') {
            if (-not (Test-Path "target\x86_64-pc-windows-msvc\release\$f")) { throw "missing $f" }
          }
      - name: Third-party notices
        run: |
          python -I packaging/cargo-notices.py --target x86_64-pc-windows-msvc `
            --package metro-desktop --package metro-server --package metro-tui `
            --out "$env:RUNNER_TEMP\notices-desktop.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $rel = 'target\x86_64-pc-windows-msvc\release'
          python -I packaging/package.py desktop --target windows-x64 --version $env:VERSION `
            --launcher "$rel\metro-desktop.exe" --server "$rel\metro-server.exe" --tui "$rel\metro-tui.exe" `
            --ui-dir "$env:RUNNER_TEMP\stage\ui" --nsh-root "$env:RUNNER_TEMP\stage\nsh-root" `
            --notices "$env:RUNNER_TEMP\notices-desktop.txt" --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Archive has the confirmed name, matches its checksum and extracts (fresh directory)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $name = "Metro-$env:VERSION-windows-x64.zip"
          $names = (Get-ChildItem dist -File | ForEach-Object Name | Sort-Object) -join ' '
          if ($names -ne "$name $name.sha256") { throw "unexpected dist contents: $names" }
          $want = ((Get-Content "dist\$name.sha256" -Raw) -split '\s+')[0].ToLower()
          $got = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          $dest = Join-Path $env:RUNNER_TEMP 'desktop-extract'
          New-Item -ItemType Directory $dest | Out-Null
          Expand-Archive "dist\$name" -DestinationPath $dest
          $root = Join-Path $dest "Metro-$env:VERSION-windows-x64"
          foreach ($f in 'Metro.exe', 'metro-server.exe', 'metro-tui.exe', 'ui\Metro.exe', 'ui\nsh\bundle.nshc', 'ui\nsh\app.json', 'ui\nsh\capabilities.json', 'ui\nsh\icon.ico') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "package is missing $f" }
          }
          # The staged terminal client runs natively (console subsystem, no server needed for --help).
          $help = & (Join-Path $root 'metro-tui.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "metro-tui.exe --help failed with $LASTEXITCODE" }
          if (-not (($help -join "`n") -match 'Metro conversations')) { throw 'unexpected metro-tui.exe --help output' }
          python -I packaging/package.py verify-desktop-icons --target windows-x64 $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No standalone runner: it is Linux-only (openat2 confinement).
          if (Get-ChildItem $dest -Recurse -File | Where-Object { $_.Name -like 'metro-runner*' }) {
            throw 'the Windows desktop package must not contain the standalone runner'
          }
          "METRO_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: The packaged app uses the real capability manifest
        run: |
          @'
          import json, sys
          nsh, version = sys.argv[1:]
          app = json.load(open(nsh + "/app.json"))
          cap = json.load(open(nsh + "/capabilities.json"))
          src = json.load(open("apps/desktop/nsh.json"))["capabilities"]
          assert app["version"] == version, app["version"]
          assert cap["process"]["env"] == src["process"]["env"], cap["process"]
          # NSH expands the manifest with defaults, so compare after normalizing the source the same way.
          want = json.loads(json.dumps(src))
          want.setdefault("network", {}).setdefault("http", [])
          want.setdefault("process", {}).setdefault("execute", [])
          want["process"].setdefault("exit", False)
          assert cap == want, "packaged capabilities differ from apps/desktop/nsh.json after normalization"
          '@ | python -I - "$env:METRO_ROOT\ui\nsh" $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          VERSION: ${{ needs.meta.outputs.version }}
      - name: Packaged metro-server runs natively on Windows (documented env config, loopback)
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'server-run'
          New-Item -ItemType Directory $work | Out-Null
          $port = 18787
          $env:METRO_BIND = "127.0.0.1:$port"
          $env:METRO_DB = Join-Path $work 'metro.sqlite3'
          # Random throwaway dev token, never printed; the server refuses to start without an auth mode.
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $env:METRO_DEV_USERS = '{"ci":"' + (($bytes | ForEach-Object { $_.ToString('x2') }) -join '') + '"}'
          $log = Join-Path $work 'server.log'
          $p = Start-Process -FilePath "$env:METRO_ROOT\metro-server.exe" -WorkingDirectory $work -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "metro-server exited early with code $($p.ExitCode): $(Get-Content "$log.err" -Raw)" }
              try { $ok = (Invoke-RestMethod "http://127.0.0.1:$port/healthz" -TimeoutSec 2) -ne $null } catch { }
            }
            if (-not $ok) { throw 'metro-server did not answer /healthz within 30 s' }
          } finally { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
      - name: A clean profile starts locally on first launch and reopen, without clicks (native Windows)
        run: |
          # Throwaway absolute desktop home; the same home is used for the second launch.
          # No credentials are supplied or inspected. UI Automation observes the app without interacting.
          $work = Join-Path $env:RUNNER_TEMP 'desktop-run'
          New-Item -ItemType Directory $work | Out-Null
          $env:METRO_DESKTOP_HOME = Join-Path $work 'home'
          New-Item -ItemType Directory $env:METRO_DESKTOP_HOME | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shot" | Out-Null
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MetroWindowIcon {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr SendMessageTimeoutW(
                  IntPtr window, uint message, UIntPtr wParam, IntPtr lParam,
                  uint flags, uint milliseconds, out UIntPtr result);
          }
          '@
          $installedUi = (Resolve-Path "$env:METRO_ROOT\ui\Metro.exe").Path
          $installedServer = (Resolve-Path "$env:METRO_ROOT\metro-server.exe").Path
          function Find-Window($launcherPid) {
            $ui = Get-CimInstance Win32_Process -Filter "Name='Metro.exe' AND ParentProcessId=$launcherPid" |
              Where-Object { $_.ExecutablePath -ieq $installedUi } | Select-Object -First 1
            if ($ui) {
              $p = Get-Process -Id $ui.ProcessId -ErrorAction SilentlyContinue
              if ($p -and $p.MainWindowHandle -ne 0) { return $p }
            }
          }
          function Shot($window, $name) {
            $bmp = $null
            $graphics = $null
            try {
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($window.MainWindowHandle)
              $bounds = $root.Current.BoundingRectangle
              $app = [System.Drawing.Rectangle]::new([int]$bounds.X, [int]$bounds.Y, [int]$bounds.Width, [int]$bounds.Height)
              $b = [System.Drawing.Rectangle]::Intersect($app, [System.Windows.Forms.SystemInformation]::VirtualScreen)
              if ($b.Width -le 0 -or $b.Height -le 0) { return }
              $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$env:RUNNER_TEMP\shot\$name.png")
            } catch { Write-Host "screenshot skipped: $name" }
            finally {
              if ($graphics) { $graphics.Dispose() }
              if ($bmp) { $bmp.Dispose() }
            }
          }
          # Only the server that the launcher we started runs from the installed path counts.
          # Any other metro-server (stale, external, a different path or parent) is never accepted.
          function Get-OwnServer($launcherPid) {
            Get-CimInstance Win32_Process -Filter "Name='metro-server.exe'" |
              Where-Object { $_.ExecutablePath -and ($_.ExecutablePath -ieq $installedServer) -and $_.ParentProcessId -eq $launcherPid } |
              Select-Object -First 1
          }
          # The launcher owns the local workspace's loopback socket for the whole app
          # lifetime and hands each metro-server a WSADuplicateSocketW copy
          # (crates/connector/src/desktop_local.rs), so Windows' TCP table lists the
          # listener under the launcher's PID, never the server's. Health is therefore
          # tied to the server through its own ready file: written by this server's PID
          # for 127.0.0.1:<saved port>, listened on only by the launcher or this server,
          # only on loopback, and answering /healthz with 200.
          function Get-LocalState($server, $launcherPid) {
            $run = Join-Path $env:METRO_DESKTOP_HOME 'local\run\ready.json'
            $state = Join-Path $env:METRO_DESKTOP_HOME 'local\state.json'
            $ready = try { Get-Content -LiteralPath $run -Raw -ErrorAction Stop | ConvertFrom-Json } catch { $null }
            $saved = try { Get-Content -LiteralPath $state -Raw -ErrorAction Stop | ConvertFrom-Json } catch { $null }
            $port = if ($ready -and "$($ready.addr)" -match '^127\.0\.0\.1:(\d+)$') { [int] $Matches[1] } else { $null }
            $owners = @($launcherPid, $server.ProcessId)
            $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $owners })
            [pscustomobject] @{
              ReadyPid = if ($ready) { $ready.pid } else { $null }; Port = $port
              SavedPort = if ($saved) { $saved.port } else { $null }; Listeners = $listeners
            }
          }
          function Test-LocalHealthy($server, $launcherPid) {
            if (-not (Get-Process -Id $server.ProcessId -ErrorAction SilentlyContinue)) { return $false }
            $s = Get-LocalState $server $launcherPid
            if ($s.Listeners | Where-Object { $_.LocalAddress -notin '127.0.0.1', '::1' }) {
              throw 'the launcher or its hosted metro-server listens beyond loopback'
            }
            if ($s.ReadyPid -ne $server.ProcessId -or -not $s.Port -or $s.SavedPort -ne $s.Port) { return $false }
            $onPort = @(Get-NetTCPConnection -State Listen -LocalPort $s.Port -ErrorAction SilentlyContinue)
            if (-not $onPort -or ($onPort | Where-Object { $_.LocalAddress -ne '127.0.0.1' -or $_.OwningProcess -notin @($launcherPid, $server.ProcessId) })) {
              return $false
            }
            try { return (Invoke-WebRequest "http://127.0.0.1:$($s.Port)/healthz" -NoProxy -TimeoutSec 2).StatusCode -eq 200 } catch { return $false }
          }
          # Sanitized failure facts: process ids, paths, parents, listening addresses
          # and the ready/state pid and port. No log, token or environment content.
          function Write-LaunchDiagnostics($launcherPid) {
            Write-Host "launcher pid $launcherPid alive: $([bool] (Get-Process -Id $launcherPid -ErrorAction SilentlyContinue))"
            Get-CimInstance Win32_Process -Filter "Name='metro-server.exe' OR Name='Metro.exe'" | ForEach-Object {
              Write-Host "process $($_.Name) pid $($_.ProcessId) parent $($_.ParentProcessId) path $($_.ExecutablePath)"
            }
            $server = Get-OwnServer $launcherPid
            if ($server) {
              $s = Get-LocalState $server $launcherPid
              Write-Host "own server pid $($server.ProcessId); ready.json pid $($s.ReadyPid) port $($s.Port); state.json port $($s.SavedPort)"
              $s.Listeners | ForEach-Object { Write-Host "listener $($_.LocalAddress):$($_.LocalPort) owned by pid $($_.OwningProcess)" }
            } else { Write-Host 'no metro-server.exe from the installed path under the launcher' }
          }
          function Wait-Healthy($launcher, $seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              if ($launcher.HasExited) { return $null }
              $server = Get-OwnServer $launcher.Id
              if ($server -and (Test-LocalHealthy $server $launcher.Id)) { return $server }
              Start-Sleep -Seconds 1
            }
            return $null
          }
          function Test-LocalWorkspaceUi($window) {
            # NSH v0.6.1 exposes testID as UI Automation's AutomationId.
            # The account menu distinguishes local from remote; Chat's enabled composer
            # distinguishes a usable workspace from a window still on the startup screen.
            $element = [System.Windows.Automation.AutomationElement]
            $scope = [System.Windows.Automation.TreeScope]::Descendants
            try {
              $root = $element::FromHandle($window.MainWindowHandle)
              $account = $root.FindFirst($scope, [System.Windows.Automation.PropertyCondition]::new($element::AutomationIdProperty, 'account-menu'))
              $composer = $root.FindFirst($scope, [System.Windows.Automation.PropertyCondition]::new($element::AutomationIdProperty, 'composer'))
              return ($account -and -not $account.Current.IsOffscreen -and $account.Current.Name -like '*, on this device. Account menu' `
                -and $composer -and -not $composer.Current.IsOffscreen -and $composer.Current.IsEnabled)
            } catch [System.Windows.Automation.ElementNotAvailableException] { return $false }
          }
          foreach ($launch in 1, 2) {
            if (Get-Process -Name 'metro-server' -ErrorAction SilentlyContinue) {
              throw "launch ${launch}: a metro-server was already running before launch; refusing to accept it"
            }
            $proc = Start-Process -FilePath "$env:METRO_ROOT\Metro.exe" -WorkingDirectory $work -PassThru
            $window = $null
            try {
              for ($i = 0; $i -lt 60 -and -not $window; $i++) {
                Start-Sleep -Seconds 1
                if ($proc.HasExited) { throw "launch ${launch}: launcher exited early with code $($proc.ExitCode)" }
                $window = Find-Window $proc.Id
              }
              if (-not $window) { throw "launch ${launch}: no window from the packaged UI child within 60 s" }
              Start-Sleep -Seconds 5
              # WM_GETICON for the big and small window icons. The stock renderer
              # has no embedded icons; these must be set by its ICO sidecar.
              foreach ($size in 0, 1) {
                [UIntPtr]$icon = [UIntPtr]::Zero
                $sent = [MetroWindowIcon]::SendMessageTimeoutW(
                  $window.MainWindowHandle, 0x007f, [UIntPtr]::new([uint32]$size), [IntPtr]::Zero, 2, 5000, [ref]$icon)
                if ($sent -eq [IntPtr]::Zero -or $icon -eq [UIntPtr]::Zero) {
                  throw "launch ${launch}: no NSH window icon (WM_GETICON $size)"
                }
              }
              Shot $window "desktop-windows-$launch-start"
              $server = Wait-Healthy $proc 90
              if (-not $server) {
                Shot $window "desktop-windows-$launch-no-server"
                Write-LaunchDiagnostics $proc.Id
                throw "launch ${launch}: no healthy bundled metro-server started automatically under the launcher"
              }
              $localHome = Join-Path $env:METRO_DESKTOP_HOME 'local'
              if (-not (Get-ChildItem $localHome -Recurse -File -ErrorAction SilentlyContinue)) {
                throw "launch ${launch}: nothing was written under the fresh local home"
              }
              $usable = $false
              for ($i = 0; $i -lt 45 -and -not $window.HasExited; $i++) {
                if (Test-LocalWorkspaceUi $window) { $usable = $true; break }
                Start-Sleep -Seconds 1
              }
              if (-not $usable) {
                Shot $window "desktop-windows-$launch-no-workspace"
                throw "launch ${launch}: the packaged UI did not show a local account and usable composer"
              }
              if (-not (Test-LocalHealthy $server $proc.Id)) { throw "launch ${launch}: the bundled server stopped before the workspace check finished" }
              Shot $window "desktop-windows-$launch-local"
              Write-Host "launch ${launch}: local workspace opened automatically (server pid $($server.ProcessId))"
            } finally {
              # Close: ask the window to close, then force whatever is left, even on failure.
              if ($window -and -not $window.HasExited) {
                [void]$window.CloseMainWindow()
                Start-Sleep -Seconds 8
              }
              Get-Process | Where-Object { $_.Id -in @($proc.Id, $window.Id) } | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              if (Get-Process -Name 'metro-server' -ErrorAction SilentlyContinue) {
                Get-Process -Name 'metro-server' | Stop-Process -Force
                throw "launch ${launch}: hosted metro-server outlived the app"
              }
            }
          }
          $left = Get-Process -Name 'Metro', 'metro-desktop' -ErrorAction SilentlyContinue
          if ($left) { $left | Stop-Process -Force; throw "processes left behind after closing: $(($left | ForEach-Object Name) -join ', ')" }
      - name: Per-user installer (install, update, uninstall keeps data; path with spaces)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # Ephemeral CI VM: the Start menu shortcut and HKCU entry are real and removed again.
          $env:METRO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Metro install dir'
          $data = Join-Path $env:LOCALAPPDATA 'Metro\Desktop'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'ci-keep.txt') 'keep'
          $i = Join-Path $env:GITHUB_WORKSPACE 'packaging\install-metro-windows.ps1'
          $a = Join-Path $env:GITHUB_WORKSPACE "dist\Metro-$env:VERSION-windows-x64.zip"
          function Run-Installer { & powershell -NoProfile -ExecutionPolicy Bypass -File $i @args; if ($LASTEXITCODE -ne 0) { throw "installer failed: $args" } }
          Run-Installer -Action Install -Archive $a
          $dir = Join-Path $env:METRO_INSTALL_DIR "versions\$env:VERSION"
          foreach ($f in 'Metro.exe', 'metro-server.exe', 'ui\Metro.exe', 'enable-local-runner') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f) -PathType Leaf)) { throw "missing $f after install" }
          }
          # The shortcut and Installed-apps entry use the stable entry point, which starts the current version.
          $entry = Join-Path $env:METRO_INSTALL_DIR 'Metro.exe'
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'missing the <root>\Metro.exe entry point' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Metro.lnk'
          if ((New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath -ne $entry) { throw 'Start menu shortcut is wrong' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.metro.desktop'
          $entryKey = Get-ItemProperty $key
          if ($entryKey.DisplayVersion -ne $env:VERSION -or $entryKey.DisplayIcon -ne $entry) { throw 'uninstall entry is wrong' }
          Run-Installer -Action Update -Archive $a -NoLocalRunner
          if (Test-Path -LiteralPath (Join-Path $dir 'enable-local-runner')) { throw '-NoLocalRunner left the marker' }
          Run-Installer -Action Update -Archive $a
          if (Test-Path -LiteralPath (Join-Path $dir 'enable-local-runner')) { throw 'update did not keep the previous choice' }
          Run-Installer -Action Uninstall
          if ((Test-Path -LiteralPath $env:METRO_INSTALL_DIR) -or (Test-Path -LiteralPath $lnk) -or (Test-Path $key)) { throw 'uninstall left files, shortcut or entry' }
          if ((Get-Content (Join-Path $data 'ci-keep.txt')) -ne 'keep') { throw 'uninstall touched Metro data' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-windows-screenshot
          path: ${{ runner.temp }}/shot
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      # The unsigned seed for windows-distribution.yml. Never named dist-*, so the
      # release collection can never pick it up.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seed-desktop-windows-x64
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Windows distribution (owned by the Windows lane): turns the seed into the
  # ZIP, the MSI and the two PowerShell scripts, the ZIP and MSI each with a
  # .sha256. Pull requests and main pushes without a release: uploaded as
  # dist-desktop-windows-x64 (unsigned preview). Official main release, signed
  # (packaging/windows-release-signing.txt): the seed is uploaded as
  # unsigned-desktop-windows-x64 for windows-sign.yml in release-publish.yml,
  # the only place that may hold id-token: write. Official main release,
  # unsigned: the same unsigned build as a preview, tested natively, uploaded
  # as dist-desktop-windows-x64 for release-publish.yml. This call grants
  # contents: read only, so nothing in its tree may request more (GitHub
  # checks nested permissions before any `if:`).
  windows-distribution:
    needs: [meta, desktop-windows]
    uses: ./.github/workflows/windows-distribution.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.meta.outputs.version }}
    permissions:
      contents: read

  # Linux x64 desktop: build, package, layout, checksum, capability, server
  # and installer checks, all blocking. There is no GUI launch here.
  desktop-linux:
    needs: [meta, ui]
    runs-on: ${{ inputs.self_hosted && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-linux-x64
          path: ${{ runner.temp }}/stage
      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # Previews only: official builds always compile from a clean target. Only
      # main pushes write the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          key: x86_64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # metro-desktop's tests run on Linux in ci.yml's rust job.
      - name: Locked fetch and build tools
        run: |
          set -eu
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          python3 -I -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          readelf --version | head -1
      # Inside packaging/Dockerfile.build's `linux` stage (rust:1.98.1-bookworm,
      # pinned by digest; glibc 2.36), never against the runner's own glibc
      # (Debian 13 has 2.41). package.py still refuses anything above 2.39.
      # Offline, from the sources fetched above. Rootless Docker maps the
      # container's root to this user; elsewhere the container runs as this
      # user, so the build output is always the job's own.
      - name: Build metro-desktop, metro-server and metro-tui (locked, in the pinned bookworm build image)
        env:
          # Official releases only (see runner-linux).
          METRO_RELEASE_CHANNEL: ${{ inputs.release && 'release' || '' }}
        run: |
          set -eu
          docker build --quiet --target linux -t metro-linux-build:ci - < packaging/Dockerfile.build
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=rootless'; then
            user=0:0
          else
            user="$(id -u):$(id -g)"
          fi
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          container_home="$RUNNER_TEMP/cargo-container"
          mkdir -p "$container_home" "$cargo_home/registry" "$cargo_home/git"
          docker run --rm --network none --user "$user" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source" --workdir /source \
            --mount "type=bind,src=$container_home,dst=/cargo-home" \
            --mount "type=bind,src=$cargo_home/registry,dst=/cargo-home/registry" \
            --mount "type=bind,src=$cargo_home/git,dst=/cargo-home/git" \
            --env CARGO_HOME=/cargo-home --env HOME=/tmp --env METRO_RELEASE_CHANNEL \
            metro-linux-build:ci \
            cargo build --locked --release --target x86_64-unknown-linux-gnu --bin metro-desktop --bin metro-server --bin metro-tui --offline
      - name: Third-party notices
        run: |
          set -eu
          python3 -I packaging/cargo-notices.py --target x86_64-unknown-linux-gnu \
            --package metro-desktop --package metro-server --package metro-tui --out "$RUNNER_TEMP/notices-desktop.txt"
      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          rel=target/x86_64-unknown-linux-gnu/release
          python3 -I packaging/package.py desktop --target linux-x64 --version "$VERSION" \
            --launcher "$rel/metro-desktop" --server "$rel/metro-server" --tui "$rel/metro-tui" \
            --ui-dir "$RUNNER_TEMP/stage/ui" --nsh-root "$RUNNER_TEMP/stage/nsh-root" \
            --notices "$RUNNER_TEMP/notices-desktop.txt" --out-dir dist
          ls -l dist
      - name: Archive has the confirmed name, matches its checksum and extracts (fresh directory)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          name="Metro-$VERSION-linux-x64.tar.gz"
          test "$(find dist -mindepth 1 -maxdepth 1 -exec basename {} \; | sort | tr '\n' ' ')" = "$name $name.sha256 " \
            || { echo "unexpected dist contents" >&2; ls dist; exit 1; }
          (cd dist && sha256sum --check "$name.sha256")
          out="$(mktemp -d "$RUNNER_TEMP/desktop-extract.XXXXXX")"
          tar -xzf "dist/$name" -C "$out"
          root="$out/Metro-$VERSION-linux-x64"
          for f in Metro metro-server metro-tui ui/Metro ui/nsh/bundle.nshc ui/nsh/app.json ui/nsh/capabilities.json; do
            test -e "$root/$f" || { echo "package is missing $f" >&2; exit 1; }
          done
          test -x "$root/Metro" && test -x "$root/metro-server" && test -x "$root/metro-tui" && test -x "$root/ui/Metro"
          # The staged terminal client runs (no server needed for --help).
          "$root/metro-tui" --help > "$RUNNER_TEMP/tui-help.txt"
          grep -q "Metro conversations" "$RUNNER_TEMP/tui-help.txt"
          python3 -I packaging/package.py verify-desktop-icons --target linux-x64 "$root"
          # No standalone runner: runner packages are separate.
          # (`! cmd` would not stop the step under set -e.)
          if find "$out" -name 'metro-runner*' | grep -q .; then echo "desktop package contains the runner" >&2; exit 1; fi
          echo "METRO_ROOT=$root" >> "$GITHUB_ENV"
      - name: The packaged app uses the real capability manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          python3 -I - "$METRO_ROOT/ui/nsh" "$VERSION" <<'PY'
          import json, sys
          nsh, version = sys.argv[1:]
          app = json.load(open(nsh + "/app.json"))
          cap = json.load(open(nsh + "/capabilities.json"))
          src = json.load(open("apps/desktop/nsh.json"))["capabilities"]
          assert app["version"] == version, app["version"]
          assert cap["process"]["env"] == src["process"]["env"], cap["process"]
          # NSH expands the manifest with defaults, so compare after normalizing the source the same way.
          want = json.loads(json.dumps(src))
          want.setdefault("network", {}).setdefault("http", [])
          want.setdefault("process", {}).setdefault("execute", [])
          want["process"].setdefault("exit", False)
          assert cap == want, "packaged capabilities differ from apps/desktop/nsh.json after normalization"
          PY
      - name: Packaged metro-server answers /healthz (documented env config, loopback)
        run: |
          set -eu
          work="$(mktemp -d "$RUNNER_TEMP/server-run.XXXXXX")"
          # Random throwaway dev token, never printed; the server refuses to start without an auth mode.
          METRO_DEV_USERS="{\"ci\":\"$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')\"}" \
            METRO_BIND=127.0.0.1:18787 METRO_DB="$work/metro.sqlite3" "$METRO_ROOT/metro-server" >"$work/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || { cat "$work/server.log" >&2; echo "metro-server exited early" >&2; exit 1; }
            curl --fail --silent --max-time 2 http://127.0.0.1:18787/healthz && exit 0
            sleep 1
          done
          echo "metro-server did not answer /healthz" >&2; exit 1
      # No network: --install-deps (a ~60 MB download from a slow mirror) and
      # install, update and uninstall without the libraries are covered by
      # packaging/test_installers.py with fake tools.
      - name: Per-user desktop installer (explains missing libraries; install, update, uninstall when present)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          home="$(mktemp -d "$RUNNER_TEMP/desktop home.XXXXXX")"
          export HOME="$home"
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          i="$GITHUB_WORKSPACE/packaging/install-metro-linux.sh"
          a="$GITHUB_WORKSPACE/dist/Metro-$VERSION-linux-x64.tar.gz"
          app="$home/.local/share/metro-desktop-app"
          entry="$home/.local/share/applications/dev.metro.desktop.desktop"
          mkdir -p "$home/.config/metro-desktop" && echo keep > "$home/.config/metro-desktop/marker"
          if ldd "$METRO_ROOT/Metro" "$METRO_ROOT/metro-server" "$METRO_ROOT/ui/Metro" | grep -q 'not found'; then
            # Without --install-deps it refuses, shows the exact command and changes nothing.
            if sh "$i" install --archive "$a" </dev/null 2>"$RUNNER_TEMP/deps.err"; then
              echo "installed without its runtime libraries" >&2; exit 1
            fi
            grep -F 'sudo apt-get install --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 gstreamer1.0-plugins-base' "$RUNNER_TEMP/deps.err"
            grep -F -- '--install-deps' "$RUNNER_TEMP/deps.err"
            test ! -e "$app" && test ! -e "$entry"
          else
            # The libraries are already here, so the real lifecycle needs no download.
            sh "$i" install --archive "$a" </dev/null
            test -f "$app/current/enable-local-runner"
            grep -F "Exec=/usr/bin/env \"$app/versions/$VERSION/Metro\"" "$entry"
            sh "$i" check-deps
            sh "$i" update --archive "$a" --no-local-runner
            test ! -e "$app/current/enable-local-runner"
            sh "$i" update --archive "$a"
            test ! -e "$app/current/enable-local-runner"
            sh "$i" uninstall
            test ! -e "$app" && test ! -e "$entry"
          fi
          test "$(cat "$home/.config/metro-desktop/marker")" = keep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-linux-x64
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Apple-silicon macOS: builds and tests the launcher and server natively,
  # packages the stock NSH macOS runtime (pinned asset and runtime digests) as
  # the inner MetroUI.app, assembles and ad hoc signs the outer Metro.app,
  # installs it with install-metro-macos.sh into a path with spaces and checks
  # a clean start and shutdown. Ad hoc signed only: no Developer ID, no
  # notarization, no Apple credentials anywhere. Its archive is a final output
  # (dist-desktop-macos-arm64), in previews and in releases.
  desktop-macos:
    needs: meta
    runs-on: ${{ inputs.self_hosted && 'metro-ci-macos-arm64' || 'macos-15' }}
    timeout-minutes: 90
    env:
      TARGET: macos-arm64
      RUST_TARGET: aarch64-apple-darwin
      # Official longbridge/nsh v0.6.1 macOS arm64 asset.
      NSH_ASSET: nsh-macos-arm64.tar.gz
      NSH_ASSET_SHA256: ee1aed2a4d111fe90e6cceca4b9d5f834c9e11cfda525f8be984261a329c06de
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: macOS
          WANT_ARCH: ARM64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Runner architecture matches the target
        run: |
          set -eu
          test "$(uname -m)" = arm64
          sw_vers
      - name: Install pinned NSH for macOS (asset digest, then runtime digest in package.py)
        run: |
          set -eu
          archive="$RUNNER_TEMP/$NSH_ASSET"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/$NSH_ASSET"
          printf '%s  %s\n' "$NSH_ASSET_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/nsh-macos"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nsh-macos"
          printf '%s\n' "$RUNNER_TEMP/nsh-macos/nsh/bin" >> "$GITHUB_PATH"
      - name: nsh package --target macos (inner MetroUI bundle, its own identifier)
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # Package the pinned prebuilt runner. Without NSH_RUNTIME, nsh on a Mac
          # with cargo builds an app-specific runner from source instead.
          NSH_RUNTIME: ${{ runner.temp }}/nsh-macos/nsh/runtime
        run: |
          set -eu
          python3 -I - "$GITHUB_WORKSPACE/packaging" "$TARGET" "$NSH_RUNTIME/macos/nsh-macos-app" <<'PY'
          import hashlib, runpy, sys
          pinned = runpy.run_path(sys.argv[1] + "/package.py")["NSH_MACOS_APPS"][sys.argv[2]][0]
          got = hashlib.sha256(open(sys.argv[3], "rb").read()).hexdigest()
          assert got == pinned, f"NSH_RUNTIME runner is not the pinned stock runtime: {got}"
          PY
          nsh package App.tsx --target macos --id dev.metro.desktop.ui --app-version "${VERSION#v}" \
            --icon assets/metro-256.png --out "$RUNNER_TEMP/out-macos"
          find "$RUNNER_TEMP/out-macos" | head -40
          plutil -p "$RUNNER_TEMP/out-macos/Metro.app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/out-macos/Metro.app"
          codesign --display --verbose=2 "$RUNNER_TEMP/out-macos/Metro.app" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Signature|TeamIdentifier)='
          # Early, explicit: the inner executable is the stock runtime re-signed ad hoc
          # (package.py repeats this check before it assembles the outer app).
          python3 -I - "$GITHUB_WORKSPACE/packaging" "$NSH_RUNTIME/macos/nsh-macos-app" \
            "$RUNNER_TEMP/out-macos/Metro.app/Contents" "$TARGET" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          import package
          contents = Path(sys.argv[3])
          package.stock_renderer(contents / "MacOS/Metro", Path(sys.argv[2]), contents, sys.argv[4])
          print("inner executable: stock NSH runtime, re-signed ad hoc for", package.MACOS_UI_ID)
          PY
      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$RUST_TARGET"
      # Previews only: official builds always compile from a clean target. Only
      # main pushes write the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          key: aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Locked fetch and native tests of the launcher
        run: |
          set -eu
          cargo fetch --locked --target "$RUST_TARGET"
          python3 -I -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          cargo test --locked --release --target "$RUST_TARGET" -p metro-desktop
      - name: Build metro-desktop, metro-server and metro-tui (native, locked)
        env:
          # Official releases only (see runner-linux).
          METRO_RELEASE_CHANNEL: ${{ inputs.release && 'release' || '' }}
        run: |
          set -eu
          cargo build --locked --release --target "$RUST_TARGET" --bin metro-desktop --bin metro-server --bin metro-tui
      - name: Third-party notices
        run: |
          set -eu
          python3 -I packaging/cargo-notices.py --target "$RUST_TARGET" \
            --package metro-desktop --package metro-server --package metro-tui --out "$RUNNER_TEMP/notices-desktop.txt"
      - name: Package (outer Metro.app, ad hoc signed)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          rel="target/$RUST_TARGET/release"
          python3 -I packaging/package.py desktop --target "$TARGET" --version "$VERSION" \
            --launcher "$rel/metro-desktop" --server "$rel/metro-server" --tui "$rel/metro-tui" \
            --ui-dir "$RUNNER_TEMP/out-macos/Metro.app" --nsh-root "$RUNNER_TEMP/nsh-macos/nsh" \
            --notices "$RUNNER_TEMP/notices-desktop.txt" --out-dir dist-macos
          ls -l dist-macos
      # The window launch needs a GUI (Aqua) session: GitHub's macos-15 has one.
      # A runner started by a LaunchDaemon (metro-ci-macos-arm64) has none, so
      # there the headless check runs instead, says so, and fails the job on
      # any failed check. A GitHub-hosted Mac without Aqua fails.
      - name: Install into a path with spaces, then a clean start and shutdown
        timeout-minutes: 8
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          # Every check runs under a named gate; a failure reports that gate and the
          # script line. Nothing prints process arguments, the environment or tokens.
          gate=setup
          trap 'echo "::error title=macOS install smoke::gate \"$gate\" failed (step script line $LINENO)" >&2' ERR
          # Exact folder inventory: names, kinds and the marker's mode, no extras.
          # (Not `find | sort`: sort order follows the runner's en_US.UTF-8 collation.)
          inventory() { # DIR NAME=KIND...  (KIND: dir, or empty-file-644)
            python3 -I - "$@" <<'PY'
          import stat, sys
          from pathlib import Path
          folder, want = Path(sys.argv[1]), dict(a.split("=", 1) for a in sys.argv[2:])
          def kind(p):
              st = p.lstat()
              if stat.S_ISLNK(st.st_mode):
                  return "symlink"
              if stat.S_ISDIR(st.st_mode):
                  return "dir"
              if stat.S_ISREG(st.st_mode):
                  return f"{'empty-' if st.st_size == 0 else ''}file-{stat.S_IMODE(st.st_mode):03o}"
              return "other"
          got = {p.name: kind(p) for p in folder.iterdir()}
          if got != want:
              print(f"{folder.name}: expected {sorted(want.items())}, found {sorted(got.items())}", file=sys.stderr)
              sys.exit(1)
          PY
          }
          home="$(mktemp -d "$RUNNER_TEMP/mac home.XXXXXX")"
          home="$(cd "$home" && pwd -P)"
          a="$GITHUB_WORKSPACE/dist-macos/Metro-$VERSION-$TARGET.tar.gz"
          i="$GITHUB_WORKSPACE/packaging/install-metro-macos.sh"
          dir="$home/Applications/Metro Desktop"
          app="$dir/Metro.app"

          gate="install (path with spaces)"
          HOME="$home" sh "$i" install --archive "$a"
          gate="install folder holds exactly Metro.app and the local-runner marker"
          inventory "$dir" Metro.app=dir enable-local-runner=empty-file-644
          gate="codesign --verify --deep --strict Metro.app"
          codesign --verify --deep --strict "$app"
          gate="codesign --verify --strict MetroUI.app"
          codesign --verify --strict "$app/Contents/Helpers/MetroUI.app"
          gate="codesign --verify --strict metro-tui"
          codesign --verify --strict "$app/Contents/MacOS/metro-tui"
          gate="metro-tui --help (exit 0, about text on stdout)"
          "$app/Contents/MacOS/metro-tui" --help > "$RUNNER_TEMP/tui-help.txt"
          grep -q "Metro conversations" "$RUNNER_TEMP/tui-help.txt"
          gate="outer bundle identifier dev.metro.desktop"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = dev.metro.desktop
          gate="inner bundle identifier dev.metro.desktop.ui"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Helpers/MetroUI.app/Contents/Info.plist")" = dev.metro.desktop.ui

          manifest="$home/Library/Application Support/Metro/Installer/RELEASE.json"
          gate="GUI session (launchctl managername)"
          session="$(launchctl managername 2>/dev/null || true)"
          if [ "$session" = Aqua ]; then
            gate="launch smoke (smoke-macos-launch.sh names its own failing check)"
            echo "macOS: Aqua session; running the window launch smoke"
            export METRO_DESKTOP_HOME="$home/desktop data"
            sh packaging/smoke-macos-launch.sh "$app" "$manifest" "$RUNNER_TEMP/shot" "desktop-$TARGET"
          else
            test "$RUNNER_KIND" = self-hosted
            gate="headless check (smoke-macos-headless.sh names its own failing check)"
            echo "::notice title=macOS launch smoke::No Aqua (GUI) session (launchctl managername: ${session:-none}); running the headless check instead of the window launch smoke."
            sh packaging/smoke-macos-headless.sh "$app" "$manifest" "$RUNNER_TEMP/headless"
            # The data folder the launch smoke would have created, for the uninstall check below.
            export METRO_DESKTOP_HOME="$home/desktop data"
            mkdir -p "$METRO_DESKTOP_HOME"
          fi

          gate="update --no-local-runner removes only the marker"
          HOME="$home" sh "$i" update --archive "$a" --no-local-runner
          inventory "$dir" Metro.app=dir
          gate="uninstall removes the app folder and keeps Metro data"
          HOME="$home" sh "$i" uninstall
          test ! -e "$dir"
          test -d "$METRO_DESKTOP_HOME"
          gate="all checks passed"
          echo "macOS install smoke passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-macos-arm64-screenshot
          path: ${{ runner.temp }}/shot/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-macos-arm64
          path: dist-macos/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The preview aggregate: the Linux, Windows and macOS
  # desktop archives, the Windows MSI, the Linux runner, their .sha256
  # sidecars and the installer scripts in one SHA256SUMS, checked by the same
  # release_assets.py as the release but without signature requirements.
  assets:
    needs: [meta, runner-linux, windows-distribution, desktop-linux, desktop-macos]
    if: ${{ !inputs.release }}
    runs-on: ${{ inputs.self_hosted && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/collected
          merge-multiple: true
      - name: Assemble and check the preview folder (SHA256SUMS)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 -I packaging/release_assets.py assemble --version "$VERSION" --mode smoke \
            --collected "$RUNNER_TEMP/collected" --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-assets
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
