name: CI

# Public releases come only from a protected push to refs/heads/main that
# changes the checked-in version (see packaging/release_policy.py). Other
# main pushes and pull requests run CI and read-only previews only; tag
# pushes start nothing here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Every other run,
# including every push to main, has its own group and is never cancelled or
# replaced. Only actual releases are serialized, by the `publish` job's own
# concurrency group below.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `workflows` always runs. It classifies the diff of a pull request into main
# (from the merge base) or of a push to main (from github.event.before) into
# segments (packaging/ci_changes.py), and each job below runs only when its
# segment is not 'false'. An empty answer (classifier skipped, failed or not
# reached) runs the job. A skipped job counts as passed for branch protection.
# The `updates` segment gates only the separate fixture build in `rust`.
# When release-policy decides to release, every gate the `release` job needs
# runs whatever the classifier said, and `release` requires each to succeed.
# If `workflows` fails, `rust`, `containers` and `packaging` still run
# (`desktop` and `package-smoke`, as before, do not).
#
# Runners: `workflows` decides (its first step) whether this event may use
# Metro's self-hosted runners: a protected push to main, or a pull request
# into main from a branch of this repository by a verified writer. Then every
# Linux job runs on `metro-ci-linux-docker` and the macOS build on
# `metro-ci-macos-arm64`; anything else, including forks, any doubt and a
# failed `workflows`, gets GitHub-hosted runners. A chosen self-hosted label
# is a queue, never a fallback: if the runner is offline the job waits.
# Native Windows jobs, `workflows` and `release-policy` stay GitHub-hosted, as
# does everything that signs or publishes (release-publish.yml).
jobs:
  rust:
    needs: [workflows, release-policy]
    if: >-
      ${{ !cancelled() && (needs.workflows.outputs.rust != 'false'
      || needs.release-policy.outputs.release == 'true') }}
    runs-on: ${{ needs.workflows.outputs.self_hosted == 'true' && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      # Only main pushes write the cache; pull requests and other pushes only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Some tests start the real target/debug/metro-server, so build first.
      - name: Locked debug build of every binary the tests and end-to-end tests run
        run: cargo build --locked --bin metro-server --bin metro-runner --bin metro-connector --bin metro-tui
      - run: cargo test --locked --workspace
      - run: ./examples/workspace/check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Admin panel browser test (headless Chrome against a mocked admin API)
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          node crates/server/src/admin_web/admin.browser-test.mjs
      - name: End-to-end smoke test with a local model double
        run: python3 tests/e2e/smoke.py --timeout 60
      - name: End-to-end Chat and Threads test with a local model double
        run: python3 tests/e2e/threads.py --timeout 60
      - name: End-to-end runner write and shell test with a local model double
        run: python3 tests/e2e/shell.py --timeout 60
      - name: End-to-end messaging test with loopback models
        run: python3 tests/e2e/messaging.py --bin-dir target/debug --timeout 60
      - name: End-to-end Metro in Chat test with a local model double
        run: python3 tests/e2e/meta_agent.py --bin-dir target/debug --timeout 90
      - name: End-to-end conversation compaction test with a local model double
        run: python3 tests/e2e/compaction.py --bin-dir target/debug --timeout 60
      - name: End-to-end provider and runner settings test
        run: python3 tests/e2e/settings.py --timeout 60
      - name: End-to-end device connector test
        run: python3 tests/e2e/device_connector.py --timeout 60
      - name: End-to-end model routing and semantic search test
        run: python3 tests/e2e/intelligence.py --bin-dir target/debug --timeout 60
      - name: End-to-end scheduled prompts test
        run: python3 tests/e2e/schedules.py --bin-dir target/debug --timeout 150
      - name: End-to-end media library test with a local model double
        run: python3 tests/e2e/library.py --bin-dir target/debug --timeout 120
      - name: Chat attachments survive restart and follow Library access
        run: python3 tests/e2e/attachments.py --bin-dir target/debug --timeout 60
      - name: End-to-end web search on the asker's computer with loopback vendors
        run: python3 tests/e2e/web_search.py --bin-dir target/debug --timeout 90
      - name: End-to-end Pages test with a local model double
        run: python3 tests/e2e/pages.py --bin-dir target/debug --timeout 60
      - name: End-to-end agent Page tools and drafts test
        run: python3 tests/e2e/agent_pages.py --bin-dir target/debug --timeout 90
      - name: metro-tui in a real PTY against an isolated server and a scripted model
        timeout-minutes: 5
        run: timeout --kill-after=15s 240s python3 -B crates/tui/tests/pty_qa.py --bin-dir target/debug
      # Only this step builds the fixture verifier. Keep its binaries outside
      # the normal target/cache; updates.py sets the fixture env on its children.
      # This throwaway build needs neither debug info nor incremental state.
      - name: Build and run the isolated updater fixture
        if: ${{ needs.workflows.outputs.updates != 'false' || needs.release-policy.outputs.release == 'true' }}
        timeout-minutes: 15
        run: |
          set -eu
          target="$RUNNER_TEMP/metro-update-e2e-target"
          CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 \
            cargo build --locked -p metro-server -p metro-runner --target-dir "$target" \
              --features metro-server/e2e-test-release,metro-runner/e2e-test-release
          python3 tests/e2e/updates.py --bin-dir "$target/debug" --timeout 120

  desktop:
    # Release runs use the same queue as every other trusted run. Still runs
    # when release-policy is skipped.
    needs: [workflows, release-policy]
    if: >-
      ${{ !cancelled() && needs.workflows.result == 'success' && needs.release-policy.result != 'failure'
      && (needs.workflows.outputs.desktop != 'false' || needs.release-policy.outputs.release == 'true') }}
    runs-on: ${{ needs.workflows.outputs.self_hosted == 'true' && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      NSH_VERSION: v0.6.1
      NSH_ARCHIVE_SHA256: 9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Longbridge Native Shell
        run: |
          set -eu
          install_dir="$RUNNER_TEMP/nsh-$NSH_VERSION"
          mkdir -p "$install_dir"
          archive="$install_dir/nsh-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/nsh-linux-x86_64.tar.gz"
          printf '%s  %s\n' "$NSH_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir"
          printf '%s\n' "$install_dir/nsh/bin" >> "$GITHUB_PATH"
      - run: nsh check
        working-directory: apps/desktop
      # The release build is package-smoke's `ui` job (when the `previews` segment runs).
      - name: NSH headless tests (all files, isolated workers)
        env:
          METRO_NSH_WORKERS: '2'
        run: python3 -B ../../packaging/nsh_ci_tests.py
        working-directory: apps/desktop

  containers:
    needs: [workflows, release-policy]
    if: >-
      ${{ !cancelled() && (needs.workflows.outputs.containers != 'false'
      || needs.release-policy.outputs.release == 'true') }}
    runs-on: ${{ needs.workflows.outputs.self_hosted == 'true' && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: docker build --target server -t metro-server:ci .
      - run: docker build --target runner -t metro-runner:ci .
      - name: Compose files validate; the default stack is server-only
        run: |
          set -eu
          test "$(docker compose config --services)" = server
          docker compose --profile runner --profile reusable-runner config --services | grep -qx registered-runner
          # Dummy path only: config reads no file contents.
          METRO_PROVIDER_MASTER_KEY_HOST_FILE=/nonexistent/key.b64 \
            docker compose -f compose.yaml -f compose.provider-key-file.yaml config --format json > "$RUNNER_TEMP/compose.json"
          python3 -I - "$RUNNER_TEMP/compose.json" <<'PY'
          import json, sys
          cfg = json.load(open(sys.argv[1]))
          env = cfg["services"]["server"]["environment"]
          assert env["METRO_PROVIDER_KEY_FILE"] == "/run/secrets/metro_provider_master_key", env
          assert "METRO_PROVIDER_MASTER_KEY_FILE" not in env
          assert env.get("METRO_PROVIDER_MASTER_KEY") is None, "inline key must stay unset"
          mount = cfg["services"]["server"]["secrets"][0]
          assert mount["target"] == "metro_provider_master_key"
          assert cfg["secrets"][mount["source"]]["file"] == "/nonexistent/key.b64"
          PY
      - name: Compose passes optional library limits to the server
        run: |
          set -eu
          cat > "$RUNNER_TEMP/metro-library.env" <<'EOF'
          METRO_LIBRARY_MAX_FILE_BYTES=65536
          METRO_LIBRARY_USER_QUOTA_BYTES=1048576
          METRO_LIBRARY_SPACE_QUOTA_BYTES=
          METRO_LIBRARY_MAX_FILES_PER_USER=20
          METRO_LIBRARY_MAX_UPLOADS_PER_USER=3
          METRO_LIBRARY_UPLOAD_TIMEOUT_SECS=90
          METRO_LIBRARY_UPLOAD_IDLE_TIMEOUT_SECS=15
          EOF
          docker compose --env-file "$RUNNER_TEMP/metro-library.env" config --format json > "$RUNNER_TEMP/compose-library.json"
          docker compose --env-file /dev/null config --format json > "$RUNNER_TEMP/compose-library-unset.json"
          python3 -I - "$RUNNER_TEMP/compose-library.json" "$RUNNER_TEMP/compose-library-unset.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              env = json.load(f)["services"]["server"]["environment"]
          with open(sys.argv[2]) as f:
              unset = json.load(f)["services"]["server"]["environment"]
          assert env["METRO_LIBRARY_MAX_FILE_BYTES"] == "65536"
          assert env["METRO_LIBRARY_USER_QUOTA_BYTES"] == "1048576"
          assert env["METRO_LIBRARY_SPACE_QUOTA_BYTES"] == ""
          assert env["METRO_LIBRARY_MAX_FILES_PER_USER"] == "20"
          assert env["METRO_LIBRARY_MAX_CONCURRENT_UPLOADS"] is None
          for key, expected in {
              "METRO_LIBRARY_MAX_UPLOADS_PER_USER": "3",
              "METRO_LIBRARY_UPLOAD_TIMEOUT_SECS": "90",
              "METRO_LIBRARY_UPLOAD_IDLE_TIMEOUT_SECS": "15",
          }.items():
              assert env[key] == expected
              assert unset.get(key) is None
          PY
      - name: Media Compose keeps the allowlist and isolates serving from cache import
        run: |
          set -eu
          export METRO_PROVIDER_ALLOWED_BASE_URLS='["https://existing.example/v1","http://embeddinggemma2:8795/v1"]'
          compose() { docker compose -f compose.yaml -f compose.media.yaml "$@"; }
          test "$(compose config --services | sort)" = "$(printf '%s\n' embeddinggemma2 server)"
          compose --profile media-prepare config --format json > "$RUNNER_TEMP/compose-media.json"
          python3 -I - "$RUNNER_TEMP/compose-media.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as f:
              cfg = json.load(f)
          server, serve, prep = (cfg["services"][name] for name in
                                ("server", "embeddinggemma2", "embeddinggemma2-prepare"))
          assert server["environment"]["METRO_PROVIDER_ALLOWED_BASE_URLS"] == os.environ["METRO_PROVIDER_ALLOWED_BASE_URLS"]
          assert set(server["networks"]) == {"default", "media"}
          assert set(serve["networks"]) == {"media"} and not serve.get("ports")
          network = cfg["networks"]["media"]
          assert network["internal"] and network["enable_ipv6"] is False
          assert network["driver_opts"]["com.docker.network.bridge.gateway_mode_ipv4"] == "isolated"
          assert prep["network_mode"] == "none" and not prep.get("secrets")
          env = serve["environment"]
          assert env["EG2_BIND"] == "0.0.0.0:8795"
          assert env["EG2_MODEL_DIR"] == "/models/embeddinggemma-2"
          assert env["EG2_API_KEY_FILE"] == "/run/secrets/metro_eg2_api_key"
          assert env["HF_HUB_OFFLINE"] == env["TRANSFORMERS_OFFLINE"] == "1"
          assert [mount["source"] for mount in serve["secrets"]] == ["metro_eg2_api_key"]
          assert int(serve["mem_limit"]) == 8 * 1024**3
          assert int(prep["mem_limit"]) == 256 * 1024**2
          for svc in (serve, prep):
              assert svc["read_only"] and svc["cap_drop"] == ["ALL"]
              assert svc["security_opt"] == ["no-new-privileges:true"]
              assert svc["pids_limit"] == 256
              assert not any(svc.get(key) for key in ("privileged", "cap_add", "devices", "pid"))
              cache = next(v for v in svc["volumes"] if v["target"] == ("/models" if svc is serve else "/tmp"))
              assert cache["type"] == "volume" and cache["source"] == "media-model-cache"
              assert cache.get("read_only", False) == (svc is serve)
          PY
      - name: Runner image writes spaces/<sid> into a fresh named volume and survives restart
        run: |
          set -eu
          docker volume create metro-ci-workspaces
          for _ in 1 2; do
            docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
              --entrypoint sh -v metro-ci-workspaces:/workspace metro-runner:ci \
              -c 'test "$(id -u)" != 0 && mkdir -p /workspace/spaces/s-a /workspace/spaces/s-b && : > /workspace/spaces/s-a/f && test -w /workspace/spaces/s-b'
          done
          docker volume rm metro-ci-workspaces
      - name: Container runner script runs the image without exposing the token (no port, volume kept)
        run: |
          set -eu
          home="$(mktemp -d "$RUNNER_TEMP/container home.XXXXXX")"
          export HOME="$home"
          unset XDG_CONFIG_HOME
          s="$GITHUB_WORKSPACE/packaging/metro-runner-container.sh"
          # On Linux the bind-mounted mode-600 token file must belong to the image's runner
          # user (uid 1000 in the published image); build a variant that runs as this CI
          # user. Rootless Docker maps this user to uid 0 in the container, so there the
          # variant runs as that (unprivileged, --cap-drop ALL) uid 0.
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=rootless'; then
            printf 'FROM metro-runner:ci\nUSER 0:0\n' | docker build -q -t metro-runner:ci-uid - >/dev/null
          else
            docker build -q --target runner --build-arg "RUNNER_UID=$(id -u)" --build-arg "RUNNER_GID=$(id -g)" \
              -t metro-runner:ci-uid "$GITHUB_WORKSPACE" >/dev/null
          fi
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$home/runner token"
          chmod 600 "$home/runner token"
          sh "$s" setup --server-url https://metro.invalid --token-file "$home/runner token" \
            --image metro-runner:ci-uid --name metro-ci-runner --volume metro-ci-runner-ws
          sh "$s" start
          sleep 5
          test "$(docker inspect -f '{{.State.Running}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.NetworkMode}} {{json .HostConfig.PortBindings}}' metro-ci-runner)" = 'true true bridge {}'
          # grep reads the token from its private file (-f), never from argv.
          if docker inspect metro-ci-runner | grep -qF -f "$home/runner token" ||
             docker logs metro-ci-runner 2>&1 | grep -qF -f "$home/runner token"; then
            echo "the token is visible in the container configuration or log" >&2; exit 1
          fi
          docker logs metro-ci-runner 2>&1 | grep -q 'metro.invalid'
          sh "$s" remove --purge-config
          docker volume inspect metro-ci-runner-ws >/dev/null
          docker volume rm metro-ci-runner-ws

      - name: Media protocol and preprocessing tests (test-double encoder, no model weights)
        run: |
          set -eu
          docker build --target test -t metro-embeddinggemma2-test:ci services/embeddinggemma2
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 8g \
            --entrypoint /opt/venv/bin/python metro-embeddinggemma2-test:ci \
            -I -m pytest -q -m 'not real_model' -p no:cacheprovider tests
      - name: Metro library exercises the reference worker HTTP API offline
        run: |
          set -eu
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/metro-library-reference.XXXXXX")"
          cid="$(docker create --network none metro-server:ci)"
          trap 'docker rm "$cid" >/dev/null' EXIT
          # Both images use Debian bookworm. Reuse the locked server binary built above.
          docker cp "$cid:/usr/local/bin/metro-server" "$fixture_dir/metro-server"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 8g \
            --mount "type=bind,src=$fixture_dir/metro-server,dst=/metro-bin/metro-server,readonly" \
            --mount "type=bind,src=$PWD/tests/e2e,dst=/checkout/tests/e2e,readonly" \
            --workdir /src --entrypoint /opt/venv/bin/python metro-embeddinggemma2-test:ci \
            -B /checkout/tests/e2e/library_reference.py --bin-dir /metro-bin --timeout 45
      - name: Verify the serving image's non-root cache mount and decoder startup sandbox
        run: |
          set -eu
          docker build -t metro-embeddinggemma2:ci services/embeddinggemma2
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 256m \
            --entrypoint /bin/sh --mount type=volume,dst=/tmp metro-embeddinggemma2:ci \
            -ec 'test "$(id -u)" = 10001 && touch /tmp/cache-test'
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 8g \
            --entrypoint /opt/venv/bin/python metro-embeddinggemma2:ci -I - <<'PY'
          import logging
          import os
          from metro_eg2.isolation import landlock_abi, set_nondumpable
          from metro_eg2.main import _sandbox_self_test

          assert os.getuid() == 10001 and landlock_abi() >= 3
          set_nondumpable()
          logging.basicConfig(level=logging.INFO)
          _sandbox_self_test(logging.getLogger("metro_eg2"))
          PY

  workflows:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      updates: ${{ steps.changes.outputs.updates }}
      desktop: ${{ steps.changes.outputs.desktop }}
      containers: ${{ steps.changes.outputs.containers }}
      packaging: ${{ steps.changes.outputs.packaging }}
      previews: ${{ steps.changes.outputs.previews }}
      self_hosted: ${{ steps.runner-route.outputs.self_hosted }}
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # GitHub-hosted on purpose: it reads the event before anything may reach a
      # self-hosted runner.
      - name: Select GitHub-hosted or Metro self-hosted runners from the GitHub event
        id: runner-route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.parse import quote

          def verify_writer(login, user_id, token):
              if not token:
                  return False, "read-only permission lookup token unavailable"
              # Pass the step's token to this one command only. No inherited gh
              # host, debug settings, proxy overrides, or interactive prompts.
              endpoint = f"repos/wnzn/metro/collaborators/{quote(login, safe='')}/permission"
              try:
                  result = subprocess.run(
                      ["gh", "api", "--hostname", "github.com", "--method", "GET", endpoint],
                      env={"PATH": os.environ["PATH"], "GH_TOKEN": token, "GH_PROMPT_DISABLED": "1"},
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=8, check=False,
                  )
                  if result.returncode:
                      return False, "PR author permission lookup failed"
                  answer = json.loads(result.stdout)
                  account = answer["user"]
                  if account["login"] != login or type(account["id"]) is not int or account["id"] != user_id:
                      return False, "PR author permission lookup identity mismatch"
                  if answer["permission"] not in ("write", "maintain", "admin"):
                      return False, "PR author does not have verified write access"
              except (OSError, ValueError, KeyError, TypeError, subprocess.TimeoutExpired):
                  return False, "PR author permission lookup unavailable or invalid"
              return True, "same-repository PR to main by a verified writer"

          def select(env, event, token):
              if env.get("GITHUB_REPOSITORY") != "wnzn/metro" or env.get("GITHUB_REPOSITORY_ID") != "1467654868":
                  return False, "not the official Metro repository"
              actor = env.get("GITHUB_ACTOR", "")
              if not actor or actor.lower().endswith("[bot]"):
                  return False, "missing or bot workflow actor"
              kind = env.get("GITHUB_EVENT_NAME")
              if kind == "pull_request":
                  pr = event["pull_request"]
                  if pr["base"]["ref"] != "main":
                      return False, "PR does not target literal main"
                  if pr["base"]["repo"]["id"] != 1467654868 or pr["head"]["repo"]["id"] != 1467654868:
                      return False, "PR head or base is not in the official repository"
                  author = pr["user"]
                  login = author.get("login", "")
                  if not login or author["type"] != "User" or login.lower().endswith("[bot]"):
                      return False, "missing or bot PR author"
                  user_id = author.get("id")
                  if type(user_id) is not int or user_id <= 0 or not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?", login):
                      return False, "PR author lacks a valid account ID or login"
                  if (event.get("sender") or {}).get("type") == "Bot":
                      return False, "PR event sender is a bot"
                  return verify_writer(login, user_id, token)
              if kind == "push":
                  if env.get("GITHUB_REF") != "refs/heads/main" or event["ref"] != "refs/heads/main":
                      return False, "push is not to literal main"
                  if env.get("GITHUB_REF_PROTECTED") != "true":
                      return False, "main is not protected"
                  if event["deleted"] is not False or event["forced"] is not False or event["sender"]["type"] != "User":
                      return False, "push is deleted, forced, or has no human sender"
                  return True, "protected main push"
              return False, "not a push or pull_request"

          token = os.environ.pop("GH_TOKEN", "")
          try:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
                  use_metro, reason = select(os.environ, json.load(stream), token)
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              use_metro, reason = False, "event payload is missing or incomplete"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"self_hosted={'true' if use_metro else 'false'}", file=output)
          print(f"Runners: {'Metro self-hosted' if use_metro else 'GitHub-hosted'} ({reason}).")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: actionlint (pinned, checksum-verified)
        run: |
          set -eu
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Every action is pinned to a full commit SHA
        run: |
          set -eu
          bad="$(grep -hE '^\s*(-\s+)?uses:' .github/workflows/*.yml | grep -vE 'uses:\s+\./' | grep -vE 'uses:[[:space:]]+[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)"
          [ -z "$bad" ] || { printf 'unpinned actions:\n%s\n' "$bad" >&2; exit 1; }
      # One diff, one answer per segment (rust, updates, desktop, containers,
      # packaging, previews). Pull requests into main and pushes to main are
      # classified; anything else, and any doubt, answers 'true' everywhere.
      - name: Classify the changes into CI segments
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_DELETED: ${{ github.event.deleted }}
        run: python3 -I packaging/ci_changes.py >> "$GITHUB_OUTPUT"

  # Separate from `workflows`, so the desktop job and package previews do not
  # wait for these tests. Official releases still need them.
  packaging:
    needs: [workflows, release-policy]
    if: >-
      ${{ !cancelled() && (needs.workflows.outputs.packaging != 'false'
      || needs.release-policy.outputs.release == 'true') }}
    runs-on: ${{ needs.workflows.outputs.self_hosted == 'true' && 'metro-ci-linux-docker' || 'ubuntu-24.04' }}
    steps:
      # Recheck the repository, event and ref on the self-hosted runner before
      # any checkout. Hosted runners skip this step.
      - name: Self-hosted runner only for this repository's main push or same-repository PR to main
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          WANT_OS: Linux
          WANT_ARCH: X64
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = wnzn/metro
          test "$GITHUB_REPOSITORY_ID" = 1467654868
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = refs/heads/main ;;
            pull_request)
              test "$GITHUB_BASE_REF" = main
              python3 -I -c 'import json, sys; pr = json.load(open(sys.argv[1]))["pull_request"]; sys.exit(not (pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1467654868))' "$GITHUB_EVENT_PATH" ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$WANT_OS"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The self-hosted runner has the apt packages preinstalled (no sudo there).
      - name: Packaging test tools (GitHub-hosted, from apt)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils libglib2.0-bin shellcheck python3-yaml
      # GitHub's ubuntu-24.04 image ships pwsh; Debian has no package for it.
      - name: Pinned PowerShell 7 for this job (self-hosted, no sudo)
        if: runner.environment == 'self-hosted'
        env:
          PWSH_VERSION: 7.7.0
          PWSH_SHA256: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
        run: |
          set -eu
          archive="$RUNNER_TEMP/powershell-$PWSH_VERSION-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/PowerShell/PowerShell/releases/download/v$PWSH_VERSION/powershell-$PWSH_VERSION-linux-x64.tar.gz"
          printf '%s  %s\n' "$PWSH_SHA256" "$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/pwsh"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pwsh"
          chmod 755 "$RUNNER_TEMP/pwsh/pwsh"
          printf '%s\n' "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Packaging and installer tests (PE resources, app-menu integration, isolated installers)
        run: |
          set -eu
          # The PowerShell tests would skip without pwsh, so require it.
          for tool in shellcheck desktop-file-validate gio pwsh; do command -v "$tool"; done
          python3 -I -c 'import yaml'
          shellcheck -s sh packaging/*.sh
          python3 -B -m unittest discover -s packaging -v
          # Their own folders: discover -s packaging does not descend into them.
          # The public-Sigstore fixture test skips without METRO_TEST_COSIGN.
          python3 -B -m unittest discover -s packaging/release-signatures -v
          python3 -B -m unittest discover -s packaging/windows-signing -v

  # The release decision for an official main push: provenance first (no
  # secrets, read-only token), then whether this push changed the checked-in
  # version, then its eligibility (new / resume -> release; unchanged,
  # no-previous-version, done -> CI only). Only a version bump looks at tags
  # and releases. Skipped for every other event, so nothing else can release.
  release-policy:
    if: >-
      github.event_name == 'push' && github.repository == 'wnzn/metro' && github.ref == 'refs/heads/main'
      && github.repository_id == '1467654868' && github.ref_protected
      && github.event.deleted == false && github.event.forced == false && github.event.after == github.sha
      && github.workflow_ref == 'wnzn/metro/.github/workflows/ci.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provenance, checked-in version and eligibility (v<version> tag, published release)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: python3 -I packaging/release_policy.py decide

  # Test builds for the native in-app update tests (windows-distribution.yml,
  # job `updates`): e2e launchers that play versions 1.0.0 and 1.0.1 and the
  # stand-in UIs. Runs exactly when package-smoke does, never on a release
  # run. Own target dir, never release-stamped (the e2e feature refuses to
  # compile then), never packaged: the artifact isn't dist-*.
  windows-update-builds:
    needs: [workflows, release-policy]
    if: >-
      ${{ !cancelled() && needs.workflows.result == 'success'
      && needs.workflows.outputs.previews != 'false'
      && (needs.release-policy.result == 'skipped'
          || (needs.release-policy.result == 'success' && needs.release-policy.outputs.release != 'true')) }}
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-update-e2e
          workspaces: '. -> target-e2e'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the e2e update test launchers and stand-in UIs
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'windows-update-e2e-builds'
          New-Item -ItemType Directory $out | Out-Null
          $rel = 'target-e2e\x86_64-pc-windows-msvc\release'
          foreach ($v in '1.0.0', '1.0.1') {
            # Test-only workspace version in this throwaway checkout; Cargo.lock follows offline.
            $toml = [IO.File]::ReadAllText('Cargo.toml')
            $set = $toml -replace '(?m)^(\[workspace\.package\]\r?\nversion = )"[^"]+"', "`${1}`"$v`""
            if ($set -eq $toml) { throw "cannot set the workspace version to $v" }
            [IO.File]::WriteAllText('Cargo.toml', $set, [Text.UTF8Encoding]::new($false))
            cargo build --offline --release --target x86_64-pc-windows-msvc --target-dir target-e2e -p metro-desktop `
              --features e2e-test-release --bin metro-desktop --bin metro-ui-stub --example msi_update_ui
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "$rel\metro-desktop.exe" (Join-Path $out "launcher-$v.exe")
          }
          Copy-Item "$rel\metro-ui-stub.exe" (Join-Path $out 'metro-ui-stub.exe')
          Copy-Item "$rel\examples\msi_update_ui.exe" (Join-Path $out 'msi_update_ui.exe')
          git checkout -- Cargo.toml Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-update-e2e-builds
          path: ${{ runner.temp }}/windows-update-e2e-builds/
          if-no-files-found: error
          retention-days: 3

  # Build and package everything a release would ship, but publish nothing:
  # pull requests and main pushes that change a build input (the `previews`
  # segment), and every PR to another branch, but never a release run.
  # Unknown or unreadable diffs still build.
  # No secrets and contents: read only (release.yml's whole tree stays read-only).
  # It waits for windows-update-builds (windows-distribution.yml's `updates`
  # job runs those builds); a failed build fails that job, it skips nothing.
  package-smoke:
    needs: [workflows, release-policy, windows-update-builds]
    if: >-
      ${{ !cancelled() && needs.workflows.result == 'success'
      && needs.workflows.outputs.previews != 'false'
      && (needs.release-policy.result == 'skipped'
          || (needs.release-policy.result == 'success' && needs.release-policy.outputs.release != 'true')) }}
    uses: ./.github/workflows/release.yml
    with:
      release: false
      self_hosted: ${{ needs.workflows.outputs.self_hosted == 'true' }}
    permissions:
      contents: read

  # Build and exercise every platform on the exact protected push revision.
  # This tree cannot write or see signing credentials. Every gate must have
  # run and passed: a skipped gate stops the release, never waives it.
  release:
    needs: [rust, desktop, containers, workflows, packaging, release-policy]
    if: >-
      needs.release-policy.outputs.release == 'true'
      && needs.rust.result == 'success' && needs.desktop.result == 'success'
      && needs.containers.result == 'success' && needs.workflows.result == 'success'
      && needs.packaging.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      release: true
      version: ${{ needs.release-policy.outputs.version }}
      self_hosted: ${{ needs.workflows.outputs.self_hosted == 'true' }}
    permissions:
      contents: read

  # Then: Windows signing and verification (skipped when
  # packaging/windows-release-signing.txt says unsigned), exact-commit tag,
  # GHCR images, Sigstore, and automatic public release of the verified set.
  # No tag event is used.
  publish:
    needs: [release-policy, release]
    if: >-
      needs.release-policy.outputs.release == 'true'
      && github.event_name == 'push' && github.repository == 'wnzn/metro' && github.ref == 'refs/heads/main'
      && github.repository_id == '1467654868' && github.ref_protected
      && github.event.deleted == false && github.event.forced == false && github.event.after == github.sha
      && github.workflow_ref == 'wnzn/metro/.github/workflows/ci.yml@refs/heads/main'
    # Only actual releases are serialized: a second release run's `publish`
    # waits until the first one finishes and never interrupts it. Everything
    # before it (tests, read-only builds) runs per run. The `release` job only
    # builds read-only artifacts, so it needs no group.
    concurrency:
      group: metro-official-release
      cancel-in-progress: false
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.release-policy.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
