[package]
name = "metro-server"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Metro server: private Spaces, threads and personal Chat with durable SQLite history, per-Space runner job queues and Rig agents."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "metro-server"
path = "src/main.rs"

[lib]
name = "metro_server"
path = "src/lib.rs"

[features]
# tests/e2e/updates.py only: see metro_release::e2e. Never in a release build.
e2e-test-release = ["metro-release/e2e"]

[dependencies]
metro-auth = { path = "../auth" }
metro-model-protocol = { path = "../model-protocol" }
# Release verification for the daily operator notice and runner updates.
metro-release = { path = "../release", features = ["async"] }
anyhow = "1.0.100"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
futures = "0.3"
getrandom = "0.3"
# Avatars: decode PNG/JPEG under limits, downscale, re-encode as a clean PNG.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
rig-agent = { version = "0.47.0", default-features = false }
rig-core = { version = "0.47.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "0.47.0", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5"

# main.rs: a listening socket inherited from the desktop launcher
# (METRO_LISTEN_FD / METRO_LISTEN_PROTOCOL_INFO), checked before use.
[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
metro-release = { path = "../release", features = ["async", "testing"] }
# tests/media_embeddings.rs: the real connector client and job runner against
# this server's device routes.
metro-connector = { path = "../connector" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
