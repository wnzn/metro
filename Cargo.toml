[workspace]
members = [
    "crates/auth",
    "crates/connector",
    "crates/desktop",
    "crates/model-protocol",
    "crates/release",
    "crates/runner",
    "crates/server",
    "crates/tui",
    "crates/url-policy",
]
resolver = "3"

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.98.1"

[profile.release]
strip = "symbols"
