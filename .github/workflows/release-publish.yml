name: Release publication

# CI calls this only after its tests and the platform smoke gates pass on the
# official protected main push that bumped the version. Sign and verify
# Windows (or, when packaging/windows-release-signing.txt says `unsigned`,
# skip signing and ship the unsigned Windows build that release.yml's
# windows-distribution built and tested natively), pin v<version> at that
# commit, assemble the set, verify GHCR and Sigstore signatures, and publicly
# promote the complete release. The tag is a marker, not a workflow trigger.
# A release ships Windows and Linux only: macOS builds and signing are off for
# now (see release.yml).
#
# Every job after windows-sign states its own condition: with windows-sign
# skipped (unsigned), GitHub would otherwise skip everything that depends on
# it. Each one still needs every earlier job to have succeeded.

on:
  workflow_call:
    inputs:
      version:
        description: 'Checked-in release version chosen by ci.yml, without the leading v.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      # signed or unsigned, from the checked-in packaging/windows-release-signing.txt.
      windows_signing: ${{ steps.check.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the push's before commit, to recheck the version bump
          persist-credentials: false
      - name: Recheck exact protected main provenance, the version bump and eligibility before the Windows gate
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: python3 -I packaging/release_policy.py authorize --version "$VERSION"

  # Signed releases only. With `unsigned` this is skipped: no signing variables,
  # no windows-release-signing environment and no OIDC token for Windows.
  windows-sign:
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true' && needs.authorize.outputs.windows_signing == 'signed'
    uses: ./.github/workflows/windows-sign.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read
      id-token: write

  # Signed: only after windows-sign succeeded. Unsigned: only with windows-sign
  # skipped; the unsigned Windows build was already tested in release.yml.
  tag:
    needs: [authorize, windows-sign]
    if: >-
      ${{ !cancelled() && needs.authorize.result == 'success' && needs.authorize.outputs.proceed == 'true'
      && ((needs.authorize.outputs.windows_signing == 'signed' && needs.windows-sign.result == 'success')
      || (needs.authorize.outputs.windows_signing == 'unsigned' && needs.windows-sign.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.pin.outputs.proceed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the push's before commit, to recheck the version bump
          persist-credentials: false
      - name: Verify protected main provenance and the version bump, create the tag if missing and read it back
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: python3 -I packaging/release_policy.py tag --version "$VERSION"

  # Only after tag pinned v<version> here; otherwise nothing below runs.
  assets:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.tag.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/collected
          merge-multiple: true
          digest-mismatch: error
      - name: Assemble and check the release folder (SHA256SUMS)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 -I packaging/release_assets.py assemble --version "$VERSION" --mode release \
            --collected "$RUNNER_TEMP/collected" --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  images:
    needs: [tag, assets]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.assets.result == 'success' }}
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ inputs.version }}
      push: true
    permissions:
      contents: read
      packages: write
      id-token: write

  sign:
    needs: [tag, assets, images]
    if: >-
      ${{ !cancelled() && needs.tag.result == 'success' && needs.assets.result == 'success'
      && needs.images.result == 'success' }}
    uses: ./.github/workflows/sign-release-assets.yml
    with:
      version: ${{ inputs.version }}
      revision: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write

  publish:
    needs: [tag, assets, images, sign]
    if: >-
      ${{ !cancelled() && needs.tag.result == 'success' && needs.assets.result == 'success'
      && needs.images.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Only the verified, signed set is promoted
        run: |
          set -eu
          dir="$(mktemp -d "$RUNNER_TEMP/cosign.XXXXXX")"
          sh packaging/release-signatures/install_cosign.sh "$dir/cosign"
          python3 -I packaging/release-signatures/release_signatures.py verify --version "$VERSION" \
            --revision "$GITHUB_SHA" --cosign "$dir/cosign" --directory "$RUNNER_TEMP/release"
      - name: Stage the verified assets, verify GitHub's uploaded digests, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_AFTER: ${{ github.event.after }}
        run: python3 -I packaging/release_policy.py publish --version "$VERSION" --dir "$RUNNER_TEMP/release"
